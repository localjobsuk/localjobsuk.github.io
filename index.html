<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>LocalJobsUK | Verified Local Jobs for Tradespeople</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="navbar-container"></div>

<main>
  <section class="hero">
    <h1>Hire Local Workers. Fast.</h1>
    <p>LocalJobsUK connects people who need work done with trusted local workers. Post a job or find paid work in minutes.</p>
    <div class="cta-buttons">
      <a href="post-job.html" class="btn">Post a Job</a>
      <a href="worker.html" class="btn">Find Work</a>
    </div>
  </section>

  <section class="info-box">
    <strong>How it works:</strong>
    <ol>
      <li>Buy credits</li>
      <li>Unlock jobs</li>
      <li>Contact job owner directly</li>
      <li>Get hired — no commission!</li>
    </ol>
  </section>

  <footer>
    <p>© 2026 LocalJobsUK</p>
  </footer>
</main>

<script>
document.addEventListener("DOMContentLoaded", async () => {
  const navbarContainer = document.getElementById("navbar-container");
  const response = await fetch("navbar.html");
  navbarContainer.innerHTML = await response.text();
  await import("./navbar.js");
});
</script>

</body>
</html>
