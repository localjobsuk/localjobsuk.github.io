<script type="module">
import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
const auth = getAuth();

// Make logout global
window.logout = async function() {
  await signOut(auth);
  window.location.href = "index.html";
};

// Update auth links dynamically
const authLinks = document.getElementById("navAuthLinks");
onAuthStateChanged(auth, user => {
  if (user) {
    authLinks.innerHTML = `
      <a href="owner-dashboard.html" style="color:#fff; text-decoration:none; font-weight:bold;">My Jobs</a>
      <a href="#" onclick="logout()" style="color:#fff; text-decoration:none; font-weight:bold;">Logout</a>
    `;
  } else {
    authLinks.innerHTML = `
      <a href="login.html" style="color:#fff; text-decoration:none; font-weight:bold;">Login</a>
      <a href="post-job.html" style="color:#fff; text-decoration:none; font-weight:bold;">Post a Job</a>
    `;
  }
});
</script>
