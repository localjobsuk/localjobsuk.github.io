<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Verify Your Identity | LocalJobsUK</title>
<link rel="stylesheet" href="style.css">
<style>
body { font-family:'Inter', sans-serif; background:#f7f7f7; margin:0; padding:0; }
.container { max-width:500px; margin:50px auto; background:#fff; padding:20px; border-radius:10px; box-shadow:0 2px 8px rgba(0,0,0,0.1); }
h2 { text-align:center; color:#203a43; margin-bottom:15px; }
form { display:flex; flex-direction:column; gap:12px; }
input, button { padding:10px; border-radius:6px; border:1px solid #ccc; font-size:1em; }
button { background:#203a43; color:#fff; border:none; font-weight:bold; cursor:pointer; transition:0.2s; }
button:hover { background:#3498db; }
.toast { position:fixed; bottom:20px; left:50%; transform:translateX(-50%); background:#203a43; color:#fff; padding:12px 20px; border-radius:10px; display:none; z-index:1000; }
</style>
</head>
<body>

<div class="container">
  <h2>Verify Your Identity</h2>
  <p>Please upload a valid ID document and confirm your contact number to complete verification.</p>
  <form id="verifyForm">
    <input type="text" id="contactNumber" placeholder="Contact Number" required>
    <input type="file" id="idUpload" accept="image/*,.pdf" required>
    <button type="submit">Submit Verification</button>
  </form>
</div>

<div class="toast" id="toast"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
import { getFirestore, doc, updateDoc, getDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
import { getStorage, ref, uploadBytes, getDownloadURL } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-storage.js";

const firebaseConfig = { /* your config */ };
const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);
const storage = getStorage(app);

const form = document.getElementById("verifyForm");
const toast = document.getElementById("toast");
let currentUser=null;

function showToast(msg){
  toast.textContent = msg;
  toast.style.display = "block";
  setTimeout(()=>{ toast.style.display="none"; }, 3000);
}

// Ensure user is logged in
onAuthStateChanged(auth, user=>{
  if(!user) window.location.href="login.html";
  currentUser=user;
});

form.addEventListener("submit", async (e)=>{
  e.preventDefault();
  const contactNumber = document.getElementById("contactNumber").value.trim();
  const file = document.getElementById("idUpload").files[0];
  if(!contactNumber || !file) return showToast("Please fill all fields and upload your ID");

  try{
    // Upload ID to Storage
    const storageRef = ref(storage, `verificationIDs/${currentUser.uid}_${Date.now()}_${file.name}`);
    await uploadBytes(storageRef, file);
    const idUrl = await getDownloadURL(storageRef);

    // Update user in Firestore
    await updateDoc(doc(db, "users", currentUser.uid), {
      contactNumber,
      idUrl,
      verified: false // Admin will approve
    });

    showToast("Verification submitted! Waiting for admin approval.");
    setTimeout(()=>{ window.location.href="index.html"; }, 2000);

  }catch(err){ showToast(err.message); }
});
</script>
</body>
</html>
