<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>My Unlocks - LocalJobsUK</title>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="navbar-container"></div>

<h2>My Unlock History</h2>

<div class="info-box">
  View all jobs you have unlocked, credits spent, and refund status.
</div>

<div id="total-credits" class="info-box" style="text-align:center;">
  Total Credits Spent: 0
</div>

<div id="unlocks-container"></div>

<script>
fetch("navbar.html")
  .then(res => res.text())
  .then(data => document.getElementById("navbar-container").innerHTML = data)
  .then(() => { 
      const script = document.createElement("script");
      script.src = "navbar.js";
      document.body.appendChild(script);
  });

const db = firebase.firestore();

firebase.auth().onAuthStateChanged(async (user) => {
  if (!user) {
    window.location.href = "login.html";
    return;
  }

  const unlocksRef = db.collection("users").doc(user.uid).collection("unlocks");
  const unlockSnapshot = await unlocksRef.get();

  let totalCredits = 0;

  const container = document.getElementById("unlocks-container");

  if (unlockSnapshot.empty) {
    container.innerHTML = "<p style='text-align:center;margin-top:20px;'>You have not unlocked any jobs yet.</p>";
    return;
  }

  for (const doc of unlockSnapshot.docs) {
    const unlock = doc.data();
    totalCredits += unlock.cost || 0;

    const jobDoc = await db.collection("jobs").doc(unlock.jobId).get();
    const job = jobDoc.exists ? jobDoc.data() : { title: "Job removed", location: "-", createdAt: null };

    const unlockCard = document.createElement("div");
    unlockCard.className = "job-card";

    const unlockDate = unlock.unlockedAt ? unlock.unlockedAt.toDate() : new Date();
    const timeAgo = (() => {
      const now = new Date();
      const seconds = Math.floor((now - unlockDate) / 1000);
      const hours = Math.floor(seconds / 3600);
      const days = Math.floor(hours / 24);
      if (days > 0) return `${days} day(s) ago`;
      if (hours > 0) return `${hours} hour(s) ago`;
      return "Just now";
    })();

    const isNew = job.createdAt && (new Date() - job.createdAt.toDate()) < 86400000;

    unlockCard.innerHTML = `
      <h3>
        ${job.title} ${isNew ? '<span class="new-badge">🔥 NEW</span>' : ''}
      </h3>
      <p>📍 ${job.location}</p>
      <p>🕒 Unlocked: ${timeAgo}</p>
      <p>💳 Credits Spent: ${unlock.cost}</p>
      <p>💰 Refund Status: ${unlock.refunded ? 'Refunded' : 'Not Refunded'}</p>
    `;

    container.appendChild(unlockCard);
  }

  document.getElementById("total-credits").innerText = `Total Credits Spent: ${totalCredits}`;
});
</script>

</body>
</html>
