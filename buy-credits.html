<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Buy Credits - LocalJobsUK</title>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="navbar-container"></div>

<h2>Buy Credits</h2>

<div class="info-box">
  <strong>Need More Credits?</strong>
  <p>
    Select one of the credit packs below.<br>
    Your credit balance will update instantly and never expires.
  </p>
</div>

<div id="packs-container">
  <div class="credit-pack" onclick="buyCredits(10)">
    <div class="pack-title">10 Credits</div>
    <div class="pack-price">£5</div>
  </div>

  <div class="credit-pack" onclick="buyCredits(30)">
    <div class="pack-title">30 Credits</div>
    <div class="pack-price">£12</div>
  </div>

  <div class="credit-pack" onclick="buyCredits(100)">
    <div class="pack-title">100 Credits</div>
    <div class="pack-price">£35</div>
  </div>
</div>

<script>
  fetch("navbar.html")
    .then(res => res.text())
    .then(data => document.getElementById("navbar-container").innerHTML = data)
    .then(() => { 
        const script = document.createElement("script");
        script.src = "navbar.js";
        document.body.appendChild(script);
    });

  const db = firebase.firestore();

  firebase.auth().onAuthStateChanged(user => {
    if (!user) {
      window.location.href = "login.html";
    }
  });

  async function buyCredits(amount) {
    const user = firebase.auth().currentUser;
    if (!user) return;

    const userRef = db.collection("users").doc(user.uid);
    const userDoc = await userRef.get();
    const currentCredits = userDoc.data().credits || 0;

    await userRef.update({ credits: currentCredits + amount });

    alert(`Successfully added ${amount} credits!`);
    location.reload();
  }
</script>

</body>
</html>
