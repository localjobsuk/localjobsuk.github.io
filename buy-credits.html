<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Buy Credits | LocalJobsUK</title>
<link rel="stylesheet" href="style.css">

<style>
body{
  font-family:Arial;
  margin:0;
  background:#f4f6f8;
}

.container{
  max-width:1100px;
  margin:60px auto;
  padding:20px;
  text-align:center;
}

.packages{
  display:flex;
  gap:20px;
  justify-content:center;
  flex-wrap:wrap;
  margin-top:40px;
}

.card{
  background:#fff;
  padding:30px;
  border-radius:12px;
  width:280px;
  box-shadow:0 4px 15px rgba(0,0,0,0.08);
  transition:0.2s;
}

.card:hover{
  transform:translateY(-5px);
}

.price{
  font-size:2em;
  font-weight:bold;
  margin:10px 0;
}

button{
  padding:12px 20px;
  border:none;
  border-radius:8px;
  cursor:pointer;
  font-weight:bold;
  background:#203a43;
  color:#fff;
}

button:hover{
  background:#3498db;
}

.credit-balance{
  margin-top:20px;
  font-weight:bold;
}
</style>
</head>
<body>

<div id="navbar-container"></div>

<div class="container">
<h2>Buy Credits</h2>
<p>Unlock customer contact details by purchasing credits.</p>

<div class="credit-balance">
Current Balance: <span id="balance">0</span> credits
</div>

<div class="packages">

<div class="card">
<h3>Starter</h3>
<div class="price">£10</div>
<p>10 Credits</p>
<button onclick="buyCredits(10)">Buy</button>
</div>

<div class="card">
<h3>Professional</h3>
<div class="price">£40</div>
<p>50 Credits</p>
<button onclick="buyCredits(50)">Buy</button>
</div>

<div class="card">
<h3>Business</h3>
<div class="price">£75</div>
<p>100 Credits</p>
<button onclick="buyCredits(100)">Buy</button>
</div>

</div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
import { getFirestore, doc, getDoc, updateDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

const firebaseConfig = { /* YOUR CONFIG */ };

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

fetch("navbar.html")
.then(r=>r.text())
.then(html=>{
  document.getElementById("navbar-container").innerHTML = html;
})
.then(()=>import("./navbar.js"));

let currentUser;
let userData;

onAuthStateChanged(auth, async user=>{
  if(!user){
    window.location.href="login.html";
    return;
  }

  currentUser=user;
  const snap = await getDoc(doc(db,"users",user.uid));
  userData=snap.data();

  document.getElementById("balance").textContent = userData.credits || 0;
});

window.buyCredits = async function(amount){

  if(!currentUser){
    alert("Please login first.");
    return;
  }

  if(!confirm(`Purchase ${amount} credits?`)) return;

  // 🔴 TEMPORARY DIRECT CREDIT ADD (FOR TESTING)
  // Replace with Stripe checkout later

  await updateDoc(doc(db,"users",currentUser.uid),{
    credits: (userData.credits || 0) + amount
  });

  alert("Credits added successfully!");
  location.reload();
};
</script>

</body>
</html>
