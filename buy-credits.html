<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Buy Credits - LocalJobsUK</title>
<link rel="stylesheet" href="style.css">

<style>
body { font-family: Arial, sans-serif; background:#f4f6f8; margin:0; padding:0; }
h2 { text-align:center; margin-top:20px; color:#2c3e50; }

.info-box { max-width:600px; margin:20px auto; background:#fff; padding:20px; border-radius:8px; box-shadow:0 3px 10px rgba(0,0,0,0.1); text-align:center; }
.info-box strong { font-size:18px; display:block; margin-bottom:10px; color:#0a7cff; }

#packs-container { display:flex; justify-content:center; flex-wrap:wrap; gap:20px; max-width:700px; margin:20px auto; }

.credit-pack { background:#fff; padding:25px 20px; border-radius:8px; width:180px; text-align:center; cursor:pointer; box-shadow:0 3px 8px rgba(0,0,0,0.1); transition:0.3s; }
.credit-pack:hover { box-shadow:0 6px 15px rgba(0,0,0,0.15); transform:translateY(-3px); }
.pack-title { font-size:18px; font-weight:bold; margin-bottom:10px; color:#2c3e50; }
.pack-price { font-size:16px; color:#0a7cff; font-weight:bold; }

nav { background-color:#2c3e50; color:#fff; padding:10px 15px; display:flex; justify-content:space-around; flex-wrap:wrap; }
nav a { color:#fff; text-decoration:none; font-weight:bold; margin:5px; }
</style>
</head>
<body>

<!-- Navbar -->
<div id="navbar-container"></div>

<h2>Buy Credits</h2>

<div class="info-box">
  <strong>Need More Credits?</strong>
  <p>Select one of the credit packs below. Your credit balance will update instantly and never expires.</p>
</div>

<div id="packs-container">
  <div class="credit-pack" onclick="buyCredits(10)">
    <div class="pack-title">10 Credits</div>
    <div class="pack-price">£5</div>
  </div>
  <div class="credit-pack" onclick="buyCredits(30)">
    <div class="pack-title">30 Credits</div>
    <div class="pack-price">£12</div>
  </div>
  <div class="credit-pack" onclick="buyCredits(100)">
    <div class="pack-title">100 Credits</div>
    <div class="pack-price">£35</div>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

<script>
  // Load Navbar
  fetch("navbar.html")
    .then(res => res.text())
    .then(data => document.getElementById("navbar-container").innerHTML = data)
    .then(() => { 
        const script = document.createElement("script");
        script.src = "navbar.js";
        document.body.appendChild(script);
    });

  const firebaseConfig = { /* your config */ };
  firebase.initializeApp(firebaseConfig);
  const db = firebase.firestore();

  firebase.auth().onAuthStateChanged(user => {
    if (!user) window.location.href = "login.html";
  });

  async function buyCredits(amount) {
    const user = firebase.auth().currentUser;
    if (!user) return;

    const userRef = db.collection("users").doc(user.uid);
    const userDoc = await userRef.get();
    const currentCredits = userDoc.data().credits || 0;

    await userRef.update({ credits: currentCredits + amount });

    alert(`Successfully added ${amount} credits!`);
    location.reload();
  }
</script>

</body>
</html>
