<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Dashboard | LocalJobsUK</title>
<link rel="stylesheet" href="style.css">

<style>
body{font-family:Arial;margin:0;background:#f4f6f8;}
.container{max-width:1100px;margin:50px auto;padding:20px;}
.card{
  background:#fff;
  padding:20px;
  border-radius:10px;
  margin-bottom:20px;
  box-shadow:0 3px 10px rgba(0,0,0,0.08);
}
input{padding:8px;border-radius:6px;border:1px solid #ccc;width:100px;}
button{
  padding:8px 14px;
  border:none;
  border-radius:6px;
  cursor:pointer;
  font-weight:bold;
}
.approve{background:#27ae60;color:#fff;}
.reject{background:#c0392b;color:#fff;}
</style>
</head>
<body>

<div class="container">
<h2>Pending Job Approvals</h2>
<div id="jobList">Loading...</div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
import { 
  getFirestore, 
  collection, 
  getDocs, 
  doc, 
  updateDoc, 
  deleteDoc 
} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

const firebaseConfig = { /* YOUR CONFIG */ };
const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

onAuthStateChanged(auth,user=>{
  if(!user){window.location.href="login.html";}
});

async function loadJobs(){
  const jobList=document.getElementById("jobList");
  jobList.innerHTML="";
  const snapshot = await getDocs(collection(db,"jobs"));

  snapshot.forEach(docSnap=>{
    const job=docSnap.data();
    if(job.approved) return;

    const card=document.createElement("div");
    card.className="card";

    card.innerHTML=`
      <h3>${job.title}</h3>
      <p><strong>Category:</strong> ${job.category}</p>
      <p><strong>Location:</strong> ${job.location}</p>
      <p>${job.description}</p>
      <p><strong>Posted by:</strong> ${job.ownerName || "Unknown"}</p>
      <label>Set Credit Cost:</label>
      <input type="number" min="1" id="credit-${docSnap.id}">
      <br><br>
      <button class="approve">Approve</button>
      <button class="reject">Reject</button>
    `;

    const approveBtn = card.querySelector(".approve");
    const rejectBtn = card.querySelector(".reject");

    approveBtn.onclick=async ()=>{
      const cost=document.getElementById(`credit-${docSnap.id}`).value;
      if(!cost || cost<=0){
        alert("Set a valid credit cost.");
        return;
      }

      await updateDoc(doc(db,"jobs",docSnap.id),{
        approved:true,
        creditCost:parseInt(cost)
      });

      alert("Job approved!");
      loadJobs();
    };

    rejectBtn.onclick=async ()=>{
      if(!confirm("Delete this job?")) return;
      await deleteDoc(doc(db,"jobs",docSnap.id));
      loadJobs();
    };

    document.getElementById("jobList").appendChild(card);
  });
}

loadJobs();
</script>

</body>
</html>
