<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Dashboard | LocalJobsUK</title>
<link rel="stylesheet" href="styles.css">
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

const firebaseConfig = { /* your config */ };
const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const auth = getAuth(app);

let currentUser = null;

onAuthStateChanged(auth, async (user) => {
  if (!user) window.location.href = "login.html";
  currentUser = user;

  const token = await user.getIdTokenResult();
  if (!token.claims.admin) {
    alert("Access denied. Admins only.");
    window.location.href = "index.html";
  }

  loadAllJobs();
});

async function loadAllJobs() {
  const jobsCol = collection(db, "jobs");
  const snapshot = await getDocs(jobsCol);
  const container = document.getElementById("allJobs");
  container.innerHTML = "";

  snapshot.forEach(docSnap => {
    const job = docSnap.data();
    const div = document.createElement("div");
    div.className = "job";

    div.innerHTML = `
      <h3>${job.title} <span class="category-badge">${job.category || "Uncategorized"}</span></h3>
      <p>${job.description}</p>
      <p>📍 ${job.location || "N/A"} • 💰 Credits: ${job.creditCost || 0} • 🕒 Posted: ${job.createdAt?.toDate().toLocaleString() || "N/A"}</p>
      <p>Owner ID: ${job.ownerId}</p>
      <p>Status: ${job.approved ? "Approved ✅" : "Pending ⚠️"}</p>
      <hr>
    `;
    container.appendChild(div);
  });
}
</script>
<style>
.job { border:1px solid #ccc; padding:15px; margin-bottom:20px; border-radius:8px; background:#fff; box-shadow:0 2px 6px rgba(0,0,0,0.1); }
.category-badge { background:#3498db; color:#fff; padding:2px 6px; border-radius:4px; font-size:12px; margin-left:6px; }
</style>
</head>
<body>
<h2>Admin Dashboard — All Jobs</h2>
<div id="allJobs"></div>
</body>
</html>
