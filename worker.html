<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Available Jobs | LocalJobsUK</title>
<link rel="stylesheet" href="style.css">

<style>
:root{
  --primary:#203a43;
  --accent:#3498db;
  --bg:#f4f6f8;
}

body{margin:0;font-family:Arial;background:var(--bg);}

.container{
  max-width:1100px;
  margin:50px auto;
  padding:20px;
}

.job-card{
  background:#fff;
  padding:20px;
  border-radius:12px;
  margin-bottom:20px;
  box-shadow:0 3px 10px rgba(0,0,0,0.08);
}

.job-card h3{margin-top:0;}
.meta{color:#555;font-size:0.9em;margin-bottom:10px;}
.images{display:flex;gap:10px;margin:10px 0;flex-wrap:wrap;}
.images img{
  width:120px;
  height:100px;
  object-fit:cover;
  border-radius:8px;
}

.unlock-btn{
  padding:10px 18px;
  border:none;
  border-radius:8px;
  background:var(--primary);
  color:#fff;
  cursor:pointer;
  font-weight:bold;
}

.unlock-btn:hover{background:var(--accent);}
.locked{color:#c0392b;font-weight:bold;}
.contact-box{
  background:#eaf7ea;
  padding:10px;
  border-radius:8px;
  margin-top:10px;
}
</style>
</head>
<body>

<div id="navbar-container"></div>

<div class="container">
<h2>Available Jobs</h2>
<div id="jobList"></div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
import { getFirestore, collection, getDocs, doc, getDoc, updateDoc, addDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

const firebaseConfig = { /* YOUR CONFIG */ };

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

fetch("navbar.html")
.then(r=>r.text())
.then(html=>{
  document.getElementById("navbar-container").innerHTML = html;
})
.then(()=>import("./navbar.js"));

let currentUser;
let workerData;

onAuthStateChanged(auth, async user=>{
  if(!user){ window.location.href="login.html"; return; }
  currentUser=user;
  const snap = await getDoc(doc(db,"users",user.uid));
  workerData=snap.data();
  loadJobs();
});

async function loadJobs(){
  const jobList=document.getElementById("jobList");
  jobList.innerHTML="Loading jobs...";
  const snapshot = await getDocs(collection(db,"jobs"));
  jobList.innerHTML="";

  snapshot.forEach(docSnap=>{
    const job=docSnap.data();
    if(!job.approved) return;

    const card=document.createElement("div");
    card.className="job-card";

    const alreadyUnlocked = false;

    card.innerHTML=`
      <h3>${job.title}</h3>
      <div class="meta">
        Category: ${job.category} | Location: ${job.location}
      </div>
      <p>${job.description}</p>
      <div class="images">
        ${job.images.map(img=>`<img src="${img}">`).join("")}
      </div>
      <div>
        <strong>Unlock cost:</strong> ${job.creditCost} credits
      </div>
      <div class="locked">Contact details hidden</div>
      <button class="unlock-btn">Unlock Job</button>
    `;

    const btn=card.querySelector(".unlock-btn");

    btn.onclick=async ()=>{
      if(workerData.credits < job.creditCost){
        alert("Not enough credits. Please buy more.");
        window.location.href="buy-credits.html";
        return;
      }

      if(!confirm(`Unlock this job for ${job.creditCost} credits?`)) return;

      await updateDoc(doc(db,"users",currentUser.uid),{
        credits: workerData.credits - job.creditCost
      });

      await addDoc(collection(db,"unlocks"),{
        jobId: docSnap.id,
        workerId: currentUser.uid,
        unlockedAt: new Date()
      });

      alert("Job unlocked! You can now contact the customer.");
      location.reload();
    };

    jobList.appendChild(card);
  });
}
</script>

</body>
</html>
