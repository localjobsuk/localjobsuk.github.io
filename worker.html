<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Available Jobs | LocalJobsUK</title>
<link rel="stylesheet" href="style.css">

<style>
:root{
  --primary:#203a43;
  --accent:#3498db;
  --bg:#f4f6f8;
}

body{margin:0;font-family:Arial;background:var(--bg);}

.container{
  max-width:1100px;
  margin:50px auto;
  padding:20px;
}

.top-bar{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:25px;
}

.credit-box{
  background:#fff;
  padding:12px 18px;
  border-radius:10px;
  box-shadow:0 2px 8px rgba(0,0,0,0.08);
  font-weight:bold;
}

.job-card{
  background:#fff;
  padding:20px;
  border-radius:12px;
  margin-bottom:20px;
  box-shadow:0 3px 10px rgba(0,0,0,0.08);
}

.job-card h3{margin-top:0;}
.meta{color:#555;font-size:0.9em;margin-bottom:10px;}
.images{display:flex;gap:10px;margin:10px 0;flex-wrap:wrap;}
.images img{
  width:120px;
  height:100px;
  object-fit:cover;
  border-radius:8px;
}

.unlock-btn{
  padding:10px 18px;
  border:none;
  border-radius:8px;
  background:var(--primary);
  color:#fff;
  cursor:pointer;
  font-weight:bold;
}

.unlock-btn:hover{background:var(--accent);}
.unlock-btn:disabled{background:#aaa;cursor:not-allowed;}

.locked{color:#c0392b;font-weight:bold;}
.contact-box{
  background:#eaf7ea;
  padding:12px;
  border-radius:8px;
  margin-top:12px;
}
</style>
</head>
<body>

<div id="navbar-container"></div>

<div class="container">

<div class="top-bar">
  <h2>Available Jobs</h2>
  <div class="credit-box">
    Credits: <span id="creditBalance">0</span>
  </div>
</div>

<div id="jobList">Loading jobs...</div>

</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
import { 
  getFirestore, 
  collection, 
  getDocs, 
  doc, 
  getDoc, 
  updateDoc, 
  addDoc, 
  query, 
  where 
} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

const firebaseConfig = { /* YOUR CONFIG */ };

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

fetch("navbar.html")
.then(r=>r.text())
.then(html=>{
  document.getElementById("navbar-container").innerHTML = html;
})
.then(()=>import("./navbar.js"));

let currentUser;
let workerData;

onAuthStateChanged(auth, async user=>{
  if(!user){ window.location.href="login.html"; return; }
  currentUser=user;

  const userSnap = await getDoc(doc(db,"users",user.uid));
  workerData=userSnap.data();

  document.getElementById("creditBalance").textContent = workerData.credits || 0;

  loadJobs();
});

async function loadJobs(){
  const jobList=document.getElementById("jobList");
  jobList.innerHTML="";

  const jobSnapshot = await getDocs(collection(db,"jobs"));

  for(const docSnap of jobSnapshot.docs){

    const job=docSnap.data();
    if(!job.approved) continue;

    const unlockQuery = query(
      collection(db,"unlocks"),
      where("jobId","==",docSnap.id),
      where("workerId","==",currentUser.uid)
    );

    const unlockSnap = await getDocs(unlockQuery);
    const alreadyUnlocked = !unlockSnap.empty;

    const card=document.createElement("div");
    card.className="job-card";

    card.innerHTML=`
      <h3>${job.title}</h3>
      <div class="meta">
        Category: ${job.category} | Location: ${job.location}
      </div>
      <p>${job.description}</p>

      <div class="images">
        ${job.images?.map(img=>`<img src="${img}">`).join("") || ""}
      </div>

      <div><strong>Unlock cost:</strong> ${job.creditCost} credits</div>

      ${alreadyUnlocked 
        ? `<div class="contact-box">
             <strong>Customer Contact:</strong><br>
             Name: ${job.ownerName || "Hidden"}<br>
             Phone: ${job.ownerPhone || "Hidden"}
           </div>`
        : `<div class="locked">Contact details hidden</div>
           <button class="unlock-btn">Unlock Job</button>`
      }
    `;

    if(!alreadyUnlocked){
      const btn=card.querySelector(".unlock-btn");

      btn.onclick=async ()=>{
        if(workerData.credits < job.creditCost){
          alert("Not enough credits.");
          window.location.href="buy-credits.html";
          return;
        }

        if(!confirm(`Unlock this job for ${job.creditCost} credits?`)) return;

        await updateDoc(doc(db,"users",currentUser.uid),{
          credits: workerData.credits - job.creditCost
        });

        await addDoc(collection(db,"unlocks"),{
          jobId: docSnap.id,
          workerId: currentUser.uid,
          unlockedAt: new Date()
        });

        alert("Job unlocked successfully!");
        location.reload();
      };
    }

    jobList.appendChild(card);
  }
}
</script>

</body>
</html>
