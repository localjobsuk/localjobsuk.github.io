<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Available Jobs</title>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="navbar-container"></div>
<div id="jobs-container"></div>

<script>
  // Load navbar
  fetch("navbar.html")
    .then(res => res.text())
    .then(data => document.getElementById("navbar-container").innerHTML = data)
    .then(() => { 
        const script = document.createElement("script");
        script.src = "navbar.js";
        document.body.appendChild(script);
    });

  const db = firebase.firestore();

  // Load jobs
  db.collection("jobs").get().then(snapshot => {
    const jobsContainer = document.getElementById("jobs-container");
    snapshot.docs.forEach(doc => {
      const job = doc.data();
      const jobCard = document.createElement("div");
      jobCard.className = "job-card";
      jobCard.innerHTML = `
        <h3>${job.title}</h3>
        <p>${job.description}</p>
        <p>Credits Required: ${job.creditCost || 1}</p>
        <button onclick="unlockJob('${doc.id}', ${job.creditCost || 1})">Unlock Job</button>
      `;
      jobsContainer.appendChild(jobCard);
    });
  });

  async function unlockJob(jobId, cost) {
    const user = firebase.auth().currentUser;
    if (!user) {
      alert("You must be logged in to unlock jobs.");
      window.location.href = "login.html";
      return;
    }

    const userRef = db.collection("users").doc(user.uid);
    const userDoc = await userRef.get();
    const credits = userDoc.data().credits || 0;

    if (credits >= cost) {
      await userRef.update({ credits: credits - cost });
      alert("Job unlocked!");
      // TODO: existing unlock logic (max 3 workers)
    } else {
      alert("Not enough credits! Redirecting to buy credits.");
      window.location.href = "buy-credits.html";
    }
  }
</script>
</body>
</html>
