<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Available Jobs | LocalJobsUK</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="style.css">
<style>
body { font-family: Arial, sans-serif; background:#f4f6f8; margin:0; padding:0; }
nav { background-color:#2c3e50; color:#fff; padding:10px 15px; display:flex; justify-content:space-around; flex-wrap:wrap; }
nav a { color:#fff; text-decoration:none; font-weight:bold; margin:5px; }
h2 { text-align:center; margin-top:20px; }
.job-card { background:#fff; padding:20px; margin:20px auto; max-width:900px; border-radius:8px; box-shadow:0 3px 8px rgba(0,0,0,0.1); }
.job-card:hover { box-shadow:0 6px 12px rgba(0,0,0,0.15); transition:0.3s; }
.job-card img { max-width:100%; margin:5px 0; border-radius:5px; }
.category-badge { background:#3498db; color:#fff; padding:2px 6px; border-radius:4px; font-size:12px; }
.new-badge { background:#e74c3c; color:#fff; padding:2px 6px; border-radius:4px; font-size:12px; margin-left:5px; }
.blurred { filter: blur(5px); transition:filter 0.4s; }
.blurred.revealed { filter: blur(0); }
.info-box { background:#eef3f7; padding:10px 15px; border-radius:5px; margin-top:10px; font-size:14px; color:#333; }
.unlock-btn { padding:10px 20px; background:#0a7cff; color:#fff; border:none; border-radius:5px; cursor:pointer; margin-top:10px; }
.unlock-btn:hover { background:#065ecf; }
select { margin:10px; padding:5px; border-radius:5px; }
.message { margin:15px auto; padding:10px; border-radius:5px; background:#e0f7fa; color:#006064; text-align:center; max-width:400px; display:none; }
</style>
</head>
<body>

<div id="navbar-container"></div>

<h2>Available Jobs</h2>
<p style="text-align:center;">Your credits: <span id="credits">0</span></p>

<div style="text-align:center;">
  <label for="categoryFilter">Filter by Category:</label>
  <select id="categoryFilter">
    <option value="">All Categories</option>
    <option value="Gardening">Gardening</option>
    <option value="Cleaning">Cleaning</option>
    <option value="Delivery">Delivery</option>
    <option value="IT">IT</option>
    <option value="Other">Other</option>
  </select>
</div>

<div class="message" id="unlockMessage"></div>
<div id="jobsContainer"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getFirestore, collection, getDocs, doc, getDoc, updateDoc, arrayUnion, increment } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

const firebaseConfig = { /* your config */ };
const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const auth = getAuth(app);

let currentUser = null;
let jobsData = [];

const jobsContainer = document.getElementById("jobsContainer");
const creditsDisplay = document.getElementById("credits");
const categoryFilter = document.getElementById("categoryFilter");
const unlockMessage = document.getElementById("unlockMessage");

// Navbar load
fetch("navbar.html").then(r=>r.text()).then(html=>{
  document.getElementById("navbar-container").innerHTML = html;
  const script = document.createElement("script");
  script.src = "navbar.js";
  document.body.appendChild(script);
});

// Auth check
onAuthStateChanged(auth, async user=>{
  if(!user) window.location.href="login.html";
  currentUser = user;

  const userSnap = await getDoc(doc(db,"users",currentUser.uid));
  if(userSnap.exists()) creditsDisplay.innerText = userSnap.data().credits || 0;

  await loadJobs();
});

function timeAgo(timestamp){
  if(!timestamp) return "";
  const diff = (Date.now() - timestamp.toDate().getTime()) / 1000;
  if(diff < 60) return `${Math.floor(diff)}s ago`;
  if(diff < 3600) return `${Math.floor(diff/60)}m ago`;
  if(diff < 86400) return `${Math.floor(diff/3600)}h ago`;
  return `${Math.floor(diff/86400)}d ago`;
}

async function loadJobs(){
  const jobsSnap = await getDocs(collection(db,"jobs"));
  jobsData = jobsSnap.docs.map(d=>({id:d.id,...d.data()})).filter(j=>j.approved);
  renderJobs();
}

function renderJobs(){
  const selectedCategory = categoryFilter.value;
  jobsContainer.innerHTML = "";

  jobsData.filter(j=>!selectedCategory || j.category===selectedCategory)
    .forEach(job=>{
      const div = document.createElement("div");
      div.className = "job-card";

      const postedTime = timeAgo(job.createdAt);
      const isNew = (Date.now() - job.createdAt?.toDate().getTime()||0) < 86400000;
      const phonePreview = job.contactPreview?.phone || "XXX-XXX";
      const emailPreview = job.contactPreview?.email || "*****@***.com";

      div.innerHTML = `
        <h3>${job.title} <span class="category-badge">${job.category}</span> ${isNew?'<span class="new-badge">🔥 New</span>':''}</h3>
        <p>${job.description}</p>
        <p>📍 ${job.location||"N/A"} • 🕒 ${postedTime} • 👤 Verified Poster</p>
        <div class="job-images">${job.images?.map(img=>`<img src="${img}">`).join("")||''}</div>
        <p>💰 Credits to unlock: ${job.creditCost}</p>
        <p>📞 Phone: <span class="blurred phone">${phonePreview}</span></p>
        <p>📧 Email: <span class="blurred email">${emailPreview}</span></p>
        <div class="info-box">
          <p>✔ Automatic refund if no reply within 48h</p>
          <p>✔ Refund if job removed</p>
          <p>✔ Refund if poster inactive</p>
        </div>
        <button class="unlock-btn">Unlock Job (${job.creditCost} credits)</button>
      `;
      jobsContainer.appendChild(div);

      div.querySelector(".unlock-btn").addEventListener("click", async ()=>{
        await unlockJob(job.id, div, job.creditCost);
      });
    });
}

async function unlockJob(jobId, jobDiv, cost){
  const btn = jobDiv.querySelector(".unlock-btn");
  btn.disabled = true;
  btn.innerText="Processing…";

  try{
    const userRef = doc(db,"users",currentUser.uid);
    const userSnap = await getDoc(userRef);
    const currentCredits = userSnap.data().credits||0;

    if(currentCredits<cost){
      alert("❌ Not enough credits!");
      btn.disabled=false;
      btn.innerText=`Unlock Job (${cost} credits)`;
      return;
    }

    // Deduct credits
    await updateDoc(userRef,{credits:increment(-cost)});
    creditsDisplay.innerText = currentCredits - cost;

    // Add user to unlockedUsers
    const jobRef = doc(db,"jobs",jobId);
    await updateDoc(jobRef,{unlockedUsers: arrayUnion(currentUser.uid)});

    // Reveal contact info
    const jobSnap = await getDoc(jobRef);
    const jobData = jobSnap.data();
    const phoneEl = jobDiv.querySelector(".phone");
    phoneEl.innerText = jobData.ownerPhone || "N/A";
    phoneEl.classList.add("revealed");
    const emailEl = jobDiv.querySelector(".email");
    emailEl.innerText = jobData.ownerEmail || "N/A";
    emailEl.classList.add("revealed");

    btn.innerText="✅ Job Unlocked";
    btn.style.backgroundColor="#2e7d32";

    unlockMessage.innerText = `🎉 You unlocked "${jobData.title}" successfully!`;
    unlockMessage.style.display="block";
    setTimeout(()=>unlockMessage.style.display="none",4000);

  } catch(err){
    alert("Error unlocking job: "+err.message);
    btn.disabled=false;
    btn.innerText=`Unlock Job (${cost} credits)`;
  }
}

categoryFilter.addEventListener("change", renderJobs);
</script>
</body>
</html>
