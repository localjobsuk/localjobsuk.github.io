<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Available Jobs | LocalJobsUK</title>
<link rel="stylesheet" href="styles.css">
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getFirestore, collection, getDocs, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
import { getFunctions, httpsCallable } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-functions.js";

// 🔹 Your Firebase config here
const firebaseConfig = {
  apiKey: "...",
  authDomain: "...",
  projectId: "...",
  storageBucket: "...",
  messagingSenderId: "...",
  appId: "..."
};
const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const auth = getAuth(app);
const functions = getFunctions(app);

// 🔹 Cloud Function
const unlockJobFn = httpsCallable(functions, "unlockJob");

// DOM Elements
const jobsContainer = document.getElementById("jobsContainer");
const creditsDisplay = document.getElementById("credits");

let currentUser = null;

// 🔹 Auth listener
onAuthStateChanged(auth, async (user) => {
  if (!user) {
    window.location.href = "login.html";
    return;
  }
  currentUser = user;

  // Load user credits
  const userSnap = await getDoc(doc(db, "users", currentUser.uid));
  if (userSnap.exists()) {
    creditsDisplay.innerText = userSnap.data().credits || 0;
  }

  loadJobs();
});

// 🔹 Load approved jobs
async function loadJobs() {
  const jobsCol = collection(db, "jobs");
  const jobsSnap = await getDocs(jobsCol);

  jobsContainer.innerHTML = "";

  for (const docSnap of jobsSnap.docs) {
    const job = docSnap.data();
    const jobId = docSnap.id;

    if (!job.approved) continue;

    // Public fields
    const title = job.title;
    const description = job.description;
    const location = job.location;
    const images = job.images || [];
    const creditCost = job.creditCost || 1;

    // Contact preview
    const phonePreview = job.contactPreview?.phone || "XXXX";
    const emailPreview = job.contactPreview?.email || "*****@***.com";

    const div = document.createElement("div");
    div.className = "job";
    div.innerHTML = `
      <h3>${title}</h3>
      <p>${description}</p>
      <p>📍 ${location}</p>
      ${images.map(img => `<img src="${img}" class="job-img">`).join("")}
      <p>💰 Credits to unlock: ${creditCost}</p>
      <p>📞 Phone: <span class="blurred">${phonePreview}</span></p>
      <p>📧 Email: <span class="blurred">${emailPreview}</span></p>
      <button class="unlock-btn">Unlock Job</button>
      <hr>
    `;
    jobsContainer.appendChild(div);

    const unlockBtn = div.querySelector(".unlock-btn");
    unlockBtn.addEventListener("click", () => handleUnlock(jobId, div, creditCost));
  }
}

// 🔹 Handle unlock via Cloud Function
async function handleUnlock(jobId, jobDiv, creditCost) {
  const unlockBtn = jobDiv.querySelector(".unlock-btn");
  unlockBtn.disabled = true;
  unlockBtn.innerText = "Processing…";

  try {
    const result = await unlockJobFn({ jobId });
    if (result.data.success) {
      // Update credits
      const userSnap = await getDoc(doc(db, "users", currentUser.uid));
      creditsDisplay.innerText = userSnap.data().credits;

      // Fetch private contact info
      const metaDoc = await getDoc(doc(db, "jobs", jobId, "private", "meta"));
      if (metaDoc.exists()) {
        const meta = metaDoc.data();
        jobDiv.querySelector(".blurred").innerText = meta.fullPhone;
        jobDiv.querySelector(".blurred").nextElementSibling.innerText = meta.fullEmail;
      }

      unlockBtn.innerText = "✅ Job Unlocked";
      unlockBtn.style.backgroundColor = "#2e7d32";
      unlockBtn.disabled = true;
    }
  } catch (err) {
    alert(err.message);
    unlockBtn.disabled = false;
    unlockBtn.innerText = `Unlock Job (${creditCost} credits)`;
  }
}
</script>
<style>
.job { border: 1px solid #ccc; padding: 15px; margin-bottom: 20px; border-radius: 8px; }
.job-img { width: 100px; height: 100px; object-fit: cover; margin-right: 5px; }
.unlock-btn { background-color: #455a64; color: #fff; border: none; padding: 8px 12px; border-radius: 5px; cursor: pointer; }
.unlock-btn:disabled { background-color: #aaa; cursor: not-allowed; }
.blurred { filter: blur(4px); }
</style>
</head>
<body>
<h2>Available Jobs</h2>
<p>Your credits: <span id="credits">0</span></p>
<div id="jobsContainer"></div>
</body>
</html>
