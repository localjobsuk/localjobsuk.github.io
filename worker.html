<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Available Jobs - LocalJobsUK</title>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="navbar-container"></div>

<h2>Available Jobs</h2>

<div class="info-box">
  <strong>Browse jobs below.</strong><br>
  Unlock to see contact details. Limited availability per job.
</div>

<div id="jobs-container"></div>

<script>
fetch("navbar.html")
  .then(res => res.text())
  .then(data => document.getElementById("navbar-container").innerHTML = data)
  .then(() => { 
      const script = document.createElement("script");
      script.src = "navbar.js";
      document.body.appendChild(script);
  });

const db = firebase.firestore();

function timeAgo(timestamp) {
  if (!timestamp) return "Just now";
  const now = new Date();
  const seconds = Math.floor((now - timestamp.toDate()) / 1000);
  const hours = Math.floor(seconds / 3600);
  const days = Math.floor(hours / 24);
  if (days > 0) return `${days} day(s) ago`;
  if (hours > 0) return `${hours} hour(s) ago`;
  return "Just now";
}

db.collection("jobs").where("status", "==", "active").get()
.then(snapshot => {
  snapshot.forEach(doc => {
    const job = doc.data();
    const jobCard = document.createElement("div");
    jobCard.className = "job-card";

    const isNew = job.createdAt &&
      (new Date() - job.createdAt.toDate()) < 86400000;

    jobCard.innerHTML = `
      <h3>
        ${job.title}
        ${isNew ? '<span class="new-badge">🔥 NEW</span>' : ''}
      </h3>

      <p>${job.description}</p>

      <p>📍 ${job.location}</p>
      <p>🕒 ${timeAgo(job.createdAt)}</p>

      <p class="credit-cost">Unlock for ${job.creditCost || 1} Credits</p>

      <button onclick="unlockJob('${doc.id}', ${job.creditCost || 1})">
        Unlock Job
      </button>

      <small class="refund-note">
        ✔ Automatic refund if no reply within 48h<br>
        ✔ Credits never expire
      </small>
    `;

    document.getElementById("jobs-container").appendChild(jobCard);
  });
});

async function unlockJob(jobId, cost) {
  const user = firebase.auth().currentUser;
  if (!user) {
    window.location.href = "login.html";
    return;
  }

  const unlockRef = db.collection("users")
    .doc(user.uid)
    .collection("unlocks")
    .doc(jobId);

  const unlockDoc = await unlockRef.get();
  if (unlockDoc.exists) {
    alert("Already unlocked.");
    return;
  }

  const userRef = db.collection("users").doc(user.uid);
  const userDoc = await userRef.get();
  const credits = userDoc.data().credits || 0;

  if (credits < cost) {
    window.location.href = "buy-credits.html";
    return;
  }

  await userRef.update({ credits: credits - cost });

  await unlockRef.set({
    jobId,
    cost,
    unlockedAt: firebase.firestore.FieldValue.serverTimestamp(),
    refunded: false
  });

  alert("Job unlocked successfully!");
}
</script>

</body>
</html>
