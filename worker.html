<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Available Jobs | LocalJobsUK</title>
<link rel="stylesheet" href="style.css">
<style>
/* Filters */
.filters {
  max-width: 800px;
  margin: 20px auto;
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
}
.filters select, .filters input {
  padding: 10px;
  border-radius: 8px;
  border: 1px solid #ccc;
  flex: 1;
  min-width: 120px;
}

/* Credits display */
.credits-display {
  text-align: center;
  margin-top: 10px;
  font-weight: bold;
  font-size: 1.1em;
}
.unlock-btn {
  background: var(--accent-color);
  color: #fff;
  padding: 6px 12px;
  border-radius: 6px;
  border: none;
  cursor: pointer;
  margin-top: 5px;
}
.unlock-btn:hover { background: #2980b9; }
</style>
</head>
<body>
<div id="navbar-container"></div>

<main>
  <div class="credits-display">Credits: <span id="userCredits">0</span></div>
  <div class="filters"> ... </div>
  <div id="jobsContainer" style="max-width:800px; margin:20px auto;"></div>
</main>

<script type="module"> ... </script>
</body>

<div id="navbar-container"></div>

<div class="credits-display">
  Credits: <span id="userCredits">0</span>
</div>

<div class="filters">
  <select id="filterCategory">
    <option value="">All Categories</option>
    <option value="Gardening">Gardening</option>
    <option value="Cleaning">Cleaning</option>
    <option value="Delivery">Delivery</option>
    <option value="IT">IT</option>
    <option value="Other">Other</option>
  </select>
  <input type="text" id="filterLocation" placeholder="Location">
  <select id="sortJobs">
    <option value="newest">Newest</option>
    <option value="credit">Lowest Credit Cost</option>
  </select>
</div>

<div id="jobsContainer" style="max-width:800px; margin:20px auto;"></div>

<div class="toast" id="toast"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getFirestore, collection, getDocs, query, orderBy } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

const firebaseConfig = { /* your config */ };
const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const auth = getAuth(app);

let currentUser = null;
let userCredits = 0;
let allJobs = [];

// Navbar
document.addEventListener("DOMContentLoaded", async () => {
  const navbarContainer = document.getElementById("navbar-container");
  const response = await fetch("navbar.html");
  navbarContainer.innerHTML = await response.text();
  await import("./navbar.js");
});

// Toast helper
function showToast(msg){
  const toast = document.getElementById("toast");
  toast.textContent = msg;
  toast.style.display="block";
  setTimeout(()=>toast.style.display="none",3000);
}

// Auth check
onAuthStateChanged(auth,user=>{
  if(!user) window.location.href="login.html";
  currentUser = user;
  // Load credits from user profile
  if(user.credits !== undefined) userCredits = user.credits;
  document.getElementById("userCredits").textContent = userCredits;
  loadJobs();
});

// Load jobs
async function loadJobs(){
  const q = query(collection(db,"jobs"), orderBy("createdAt","desc"));
  const snapshot = await getDocs(q);
  allJobs = snapshot.docs.map(doc=>({id:doc.id, ...doc.data()}));
  displayJobs(allJobs);
}

// Display jobs with filters
function displayJobs(jobs){
  const container = document.getElementById("jobsContainer");
  container.innerHTML="";
  const filterCat = document.getElementById("filterCategory").value;
  const filterLoc = document.getElementById("filterLocation").value.toLowerCase();

  jobs.filter(job=>{
    return (!filterCat || job.category===filterCat) &&
           (!filterLoc || (job.location && job.location.toLowerCase().includes(filterLoc)));
  }).forEach(job=>{
    const card = document.createElement("div");
    card.classList.add("job-card");

    const title = document.createElement("div");
    title.classList.add("title");
    title.textContent = job.title;

    const category = document.createElement("div");
    category.classList.add("category");
    category.textContent = job.category + (job.location ? " | " + job.location : "");

    const desc = document.createElement("div");
    desc.textContent = job.description;

    // Images
    if(job.images && job.images.length>0){
      const img = document.createElement("img");
      img.src = job.images[0];
      card.appendChild(img);
    }

    // Contact info
    const contact = document.createElement("div");
    contact.classList.add("contact-blur");
    contact.textContent = job.contact || "Contact info hidden";

    // Unlock button if needed
    if(job.creditCost && job.creditCost>0){
      const btn = document.createElement("button");
      btn.textContent = `Unlock (${job.creditCost} credits)`;
      btn.classList.add("unlock-btn");
      btn.onclick = ()=>{
        if(userCredits >= job.creditCost){
          userCredits -= job.creditCost;
          document.getElementById("userCredits").textContent = userCredits;
          contact.classList.add("unlocked");
          showToast("✅ Contact unlocked!");
          // TODO: Update credits in Firestore
        } else showToast("❌ Not enough credits!");
      };
      card.appendChild(btn);
    } else contact.classList.add("unlocked");

    card.appendChild(title);
    card.appendChild(category);
    card.appendChild(desc);
    card.appendChild(contact);
    container.appendChild(card);
  });
}

// Filters & sorting
document.getElementById("filterCategory").addEventListener("change", ()=>displayJobs(allJobs));
document.getElementById("filterLocation").addEventListener("input", ()=>displayJobs(allJobs));
document.getElementById("sortJobs").addEventListener("change", e=>{
  const sortVal = e.target.value;
  if(sortVal==="credit") allJobs.sort((a,b)=>(a.creditCost||0)-(b.creditCost||0));
  else allJobs.sort((a,b)=>b.createdAt?.seconds - a.createdAt?.seconds);
  displayJobs(allJobs);
});
</script>
</body>
</html>
