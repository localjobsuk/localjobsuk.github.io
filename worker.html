<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Available Jobs | LocalJobsUK</title>
<link rel="stylesheet" href="style.css">

<!-- Firebase Compat -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-functions-compat.js"></script>

<style>
body { font-family: Arial, sans-serif; background:#f4f6f8; margin:0; padding:0; }
h2 { text-align:center; margin-top:20px; }
.job-card { background:#fff; padding:20px; margin:20px auto; max-width:900px; border-radius:8px; box-shadow:0 3px 8px rgba(0,0,0,0.1); }
.job-card img.job-img { max-width:100%; margin:5px 0; border-radius:5px; cursor:pointer; }
.category-badge { background:#3498db; color:#fff; padding:2px 6px; border-radius:4px; font-size:12px; }
.new-badge { background:#e74c3c; color:#fff; padding:2px 6px; border-radius:4px; font-size:12px; margin-left:5px; }
.blurred { filter: blur(5px); transition:filter 0.4s; }
.blurred.revealed { filter: blur(0); }
.info-box { background:#eef3f7; padding:10px 15px; border-radius:5px; margin-top:10px; font-size:14px; color:#333; }
.unlock-btn { padding:10px 20px; background:#0a7cff; color:#fff; border:none; border-radius:5px; cursor:pointer; margin-top:10px; }
.unlock-btn:hover { background:#065ecf; }
select { margin:10px; padding:5px; border-radius:5px; }
</style>
</head>

<body>

<!-- Navbar -->
<div id="navbar-container"></div>

<h2>Available Jobs</h2>
<p style="text-align:center;">Your credits: <span id="credits">0</span></p>

<div style="text-align:center;">
  <label for="categoryFilter">Filter by Category:</label>
  <select id="categoryFilter">
    <option value="">All Categories</option>
    <option value="Gardening">Gardening</option>
    <option value="Cleaning">Cleaning</option>
    <option value="Delivery">Delivery</option>
    <option value="IT">IT</option>
    <option value="Other">Other</option>
  </select>
</div>

<div id="jobsContainer"></div>

<script>
const firebaseConfig = {
  apiKey: "YOUR_API_KEY",
  authDomain: "YOUR_PROJECT.firebaseapp.com",
  projectId: "YOUR_PROJECT",
  storageBucket: "YOUR_PROJECT.appspot.com",
  messagingSenderId: "YOUR_SENDER_ID",
  appId: "YOUR_APP_ID"
};

if (!firebase.apps.length) {
  firebase.initializeApp(firebaseConfig);
}

const db = firebase.firestore();
const auth = firebase.auth();
const functions = firebase.app().functions("YOUR_REGION"); // e.g. "europe-west2"
const unlockJobFn = functions.httpsCallable("unlockJob");

const jobsContainer = document.getElementById("jobsContainer");
const creditsDisplay = document.getElementById("credits");
const categoryFilter = document.getElementById("categoryFilter");

let currentUser = null;
let jobsData = [];

auth.onAuthStateChanged(async user => {
  if (!user) return window.location.href = "login.html";
  currentUser = user;

  const userSnap = await db.collection("users").doc(user.uid).get();
  if (userSnap.exists) creditsDisplay.innerText = userSnap.data().credits || 0;

  loadJobs();
});

function timeAgo(timestamp) {
  if (!timestamp) return "";
  const diff = (Date.now() - timestamp.toDate().getTime()) / 1000;
  if (diff < 60) return Math.floor(diff) + "s ago";
  if (diff < 3600) return Math.floor(diff/60) + "m ago";
  if (diff < 86400) return Math.floor(diff/3600) + "h ago";
  return Math.floor(diff/86400) + "d ago";
}

async function loadJobs() {
  const snap = await db.collection("jobs").get();
  jobsData = snap.docs.map(d => ({ id: d.id, ...d.data() })).filter(j => j.approved);
  renderJobs();
}

function renderJobs() {
  const selectedCategory = categoryFilter.value;
  jobsContainer.innerHTML = "";

  jobsData
    .filter(j => !selectedCategory || j.category === selectedCategory)
    .forEach(job => {

      const div = document.createElement("div");
      div.className = "job-card";

      const postedTime = timeAgo(job.createdAt);
      const isNew = job.createdAt && (Date.now() - job.createdAt.toDate().getTime()) < 86400000;

      div.innerHTML = `
        <h3>${job.title} 
          <span class="category-badge">${job.category || ""}</span> 
          ${isNew ? '<span class="new-badge">🔥 New</span>' : ''}
        </h3>
        <p>${job.description}</p>
        <p>📍 ${job.location || "N/A"} • 🕒 ${postedTime}</p>
        <div>${(job.images || []).map(img => `<a href="${img}" target="_blank"><img src="${img}" class="job-img"></a>`).join("")}</div>
        <p>💰 Credits to unlock: ${job.creditCost}</p>
        <button class="unlock-btn">Unlock Job (${job.creditCost} credits)</button>
      `;

      jobsContainer.appendChild(div);

      div.querySelector(".unlock-btn")
        .addEventListener("click", () => handleUnlock(job.id, div, job.creditCost));
    });
}

async function handleUnlock(jobId, jobDiv, creditCost) {
  const btn = jobDiv.querySelector(".unlock-btn");
  btn.disabled = true;
  btn.innerText = "Processing...";

  try {
    const result = await unlockJobFn({ jobId });

    if (result.data.success) {
      const userSnap = await db.collection("users").doc(currentUser.uid).get();
      creditsDisplay.innerText = userSnap.data().credits;

      btn.innerText = "✅ Job Unlocked";
      btn.style.backgroundColor = "#2e7d32";
    }
  } catch (err) {
    alert(err.message);
    btn.disabled = false;
    btn.innerText = `Unlock Job (${creditCost} credits)`;
  }
}

categoryFilter.addEventListener("change", renderJobs);

document.addEventListener("DOMContentLoaded", () => {
  fetch("navbar.html")
    .then(r => r.text())
    .then(html => {
      document.getElementById("navbar-container").innerHTML = html;
      const s = document.createElement("script");
      s.src = "navbar.js";
      document.body.appendChild(s);
    });
});
</script>

</body>
</html>
