<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Available Jobs - LocalJobsUK</title>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="navbar-container"></div>

<h2>Available Jobs</h2>

<div class="info-box">
  <strong>How It Works:</strong>
  <p>
    1️⃣ Browse available jobs below.<br>
    2️⃣ Each job shows how many credits are required to unlock it.<br>
    3️⃣ Click <strong>Unlock Job</strong> to reveal contact details.<br>
    4️⃣ If you run out of credits, purchase more from the top menu.
  </p>
</div>

<div id="jobs-container"></div>

<script>
  // Load navbar
  fetch("navbar.html")
    .then(res => res.text())
    .then(data => document.getElementById("navbar-container").innerHTML = data)
    .then(() => { 
        const script = document.createElement("script");
        script.src = "navbar.js";
        document.body.appendChild(script);
    });

  const db = firebase.firestore();

  db.collection("jobs").get().then(snapshot => {
    const jobsContainer = document.getElementById("jobs-container");

    snapshot.forEach(doc => {
      const job = doc.data();

      const jobCard = document.createElement("div");
      jobCard.className = "job-card";

      jobCard.innerHTML = `
        <h3>${job.title}</h3>
        <p>${job.description}</p>
        <p class="credit-cost">Credits Required: ${job.creditCost || 1}</p>
        <button onclick="unlockJob('${doc.id}', ${job.creditCost || 1})">
          Unlock Job
        </button>
      `;

      jobsContainer.appendChild(jobCard);
    });
  });

  async function unlockJob(jobId, cost) {
    const user = firebase.auth().currentUser;
    if (!user) {
      window.location.href = "login.html";
      return;
    }

    const userRef = db.collection("users").doc(user.uid);
    const userDoc = await userRef.get();
    const credits = userDoc.data().credits || 0;

    if (credits >= cost) {
      await userRef.update({ credits: credits - cost });
      alert("Job unlocked successfully!");
      // Keep your max 3 workers logic here
    } else {
      alert("You don't have enough credits.");
      window.location.href = "buy-credits.html";
    }
  }
</script>

</body>
</html>
