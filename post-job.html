<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Post a Job | LocalJobsUK</title>
<link rel="stylesheet" href="style.css">

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getFirestore, collection, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

// 🔹 Firebase config
const firebaseConfig = { /* your config */ };
const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const auth = getAuth(app);

let currentUser = null;

// Auth check
onAuthStateChanged(auth, user => {
  if (!user) window.location.href = "login.html";
  else currentUser = user;
});

// Submit job
async function submitJob(event) {
  event.preventDefault();

  const title = document.getElementById("title").value.trim();
  const description = document.getElementById("description").value.trim();
  const location = document.getElementById("location").value.trim();
  const imagesRaw = document.getElementById("images").value.trim();
  const images = imagesRaw ? imagesRaw.split(",").map(s => s.trim()) : [];
  const category = document.getElementById("category").value;

  if (!title || !description || !category) {
    alert("Title, description, and category are required.");
    return;
  }

  try {
    await addDoc(collection(db, "jobs"), {
      title,
      description,
      location,
      images,
      category,
      ownerId: currentUser.uid,
      createdAt: serverTimestamp(),
      approved: false,
      creditCost: 0
    });

    alert("Job submitted! Waiting for admin approval.");
    document.getElementById("jobForm").reset();
  } catch (err) {
    alert("Error submitting job: " + err.message);
  }
}
</script>

<style>
body { font-family: Arial, sans-serif; background:#f4f6f8; margin:0; padding:0; }
h2 { text-align:center; margin-top:20px; color:#2c3e50; }
form.job-card { max-width:600px; margin:20px auto; display:flex; flex-direction:column; gap:15px; background:#fff; padding:25px; border-radius:8px; box-shadow:0 3px 10px rgba(0,0,0,0.1); }
form.job-card:hover { box-shadow:0 6px 15px rgba(0,0,0,0.15); transition:0.3s; }
input, textarea, select { padding:10px; border-radius:5px; border:1px solid #ccc; font-size:14px; width:100%; }
button.primary { background-color:#0a7cff; color:#fff; border:none; padding:12px; border-radius:6px; cursor:pointer; font-weight:bold; font-size:15px; }
button.primary:hover { background-color:#065ecf; }
label { font-weight:bold; margin-top:5px; }
nav { background-color:#2c3e50; color:#fff; padding:10px 15px; display:flex; justify-content:space-around; flex-wrap:wrap; }
nav a { color:#fff; text-decoration:none; font-weight:bold; margin:5px; }
</style>
</head>
<body>

<!-- Navbar -->
<div id="navbar"></div>
<script type="module">
import './navbar.js';
document.getElementById('navbar').innerHTML = await fetch('navbar.html').then(r=>r.text());
</script>

<h2>Post a Job</h2>

<form id="jobForm" class="job-card" onsubmit="submitJob(event)">
  <input type="text" id="title" placeholder="Job title" required>
  <textarea id="description" placeholder="Job description" rows="5" required></textarea>
  <input type="text" id="location" placeholder="Location">
  <input type="text" id="images" placeholder="Image URLs, comma separated">
  <label for="category">Category:</label>
  <select id="category" required>
    <option value="">Select category</option>
    <option value="Gardening">Gardening</option>
    <option value="Cleaning">Cleaning</option>
    <option value="Delivery">Delivery</option>
    <option value="IT">IT</option>
    <option value="Other">Other</option>
  </select>
  <button type="submit" class="primary">Submit Job</button>
</form>

</body>
</html>
