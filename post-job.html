<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Post a Job | LocalJobsUK</title>
<link rel="stylesheet" href="style.css">
<style>
form { max-width: 500px; margin: 20px auto; display: flex; flex-direction: column; gap: 10px; background: #fff; padding: 20px; border-radius: 8px; box-shadow: 0 2px 6px rgba(0,0,0,0.1); }
input, textarea, select { padding: 8px; border-radius: 5px; border: 1px solid #ccc; }
button { background-color: #455a64; color: #fff; border: none; padding: 10px; border-radius: 5px; cursor: pointer; }
#addPhotos { cursor:pointer; color:#203a43; text-decoration:underline; font-weight:bold; }
</style>
</head>
<body>

<div id="navbar-container"></div>

<h2>Post a Job</h2>
<form id="jobForm">
  <input type="text" id="title" placeholder="Job title" required>
  <textarea id="description" placeholder="Job description" rows="5" required></textarea>
  <input type="text" id="location" placeholder="Location">
  
  <div id="photos-container">
    <p id="addPhotos">+ Add up to 5 photos</p>
    <div id="photoInputs"></div>
  </div>

  <label for="category">Category:</label>
  <select id="category" required>
    <option value="">Select category</option>
    <option value="Gardening">Gardening</option>
    <option value="Cleaning">Cleaning</option>
    <option value="Delivery">Delivery</option>
    <option value="IT">IT</option>
    <option value="Other">Other</option>
  </select>
  <button type="submit">Submit Job</button>
</form>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getFirestore, collection, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

const firebaseConfig = { /* your config */ };
const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const auth = getAuth(app);

let currentUser = null;
onAuthStateChanged(auth, user => {
  if (!user) window.location.href = "login.html";
  else currentUser = user;
});

// navbar
document.addEventListener("DOMContentLoaded", async () => {
  const navbarContainer = document.getElementById("navbar-container");
  navbarContainer.innerHTML = await (await fetch("navbar.html")).text();

  window.logout = async function() {
    await auth.signOut();
    window.location.href = "login.html";
  };
});

// photo inputs
let photoCount = 0;
document.getElementById("addPhotos").addEventListener("click", () => {
  if(photoCount >= 5) return alert("Max 5 photos reached");
  photoCount++;
  const input = document.createElement("input");
  input.type = "text";
  input.placeholder = `Photo URL ${photoCount}`;
  input.className = "photoInput";
  document.getElementById("photoInputs").appendChild(input);
});

// submit job
document.getElementById("jobForm").addEventListener("submit", async e => {
  e.preventDefault();
  const title = document.getElementById("title").value.trim();
  const description = document.getElementById("description").value.trim();
  const location = document.getElementById("location").value.trim();
  const category = document.getElementById("category").value;
  const images = Array.from(document.getElementsByClassName("photoInput")).map(i=>i.value.trim()).filter(Boolean);

  if(!title || !description || !category) return alert("Please fill required fields");

  try {
    await addDoc(collection(db, "jobs"), {
      title, description, location, category, images, ownerId: currentUser.uid,
      approved:false, creditCost:0, createdAt:serverTimestamp()
    });
    alert("✅ Job successfully added! It will be reviewed by admin.");
    document.getElementById("jobForm").reset();
    document.getElementById("photoInputs").innerHTML = "";
    photoCount = 0;
  } catch(err) {
    alert("Error: "+err.message);
  }
});
</script>

</body>
</html>
