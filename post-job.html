<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Post a Job | LocalJobsUK</title>
<link rel="stylesheet" href="style.css">

<style>
:root{
  --primary:#203a43;
  --accent:#3498db;
  --bg:#f4f6f8;
}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:var(--bg);
}

.container{
  max-width:700px;
  margin:60px auto;
  background:#fff;
  padding:35px;
  border-radius:12px;
  box-shadow:0 4px 15px rgba(0,0,0,0.08);
}

h2{text-align:center;margin-bottom:10px;}
.step{margin-bottom:25px;}

label{font-weight:bold;display:block;margin-bottom:8px;}
select,textarea,input{
  width:100%;
  padding:12px;
  border-radius:8px;
  border:1px solid #ccc;
  font-size:1em;
}

textarea{resize:vertical;min-height:120px;}

.counter{
  text-align:right;
  font-size:0.9em;
  color:#666;
}

.dropzone{
  border:2px dashed #ccc;
  padding:20px;
  text-align:center;
  border-radius:10px;
  cursor:pointer;
  background:#fafafa;
}

.preview{
  display:flex;
  gap:10px;
  margin-top:10px;
  flex-wrap:wrap;
}

.preview img{
  width:100px;
  height:100px;
  object-fit:cover;
  border-radius:8px;
  border:1px solid #ccc;
}

.btn{
  width:100%;
  padding:14px;
  background:var(--primary);
  color:#fff;
  border:none;
  border-radius:10px;
  font-weight:bold;
  cursor:pointer;
}

.btn:hover{background:var(--accent);}

.error{color:#c0392b;font-size:0.9em;}
</style>
</head>
<body>

<div id="navbar-container"></div>

<div class="container">
<h2>Tell us about your job</h2>
<p style="text-align:center;color:#555;">
Tradespeople will use this information to decide if they can help you.
</p>

<form id="jobForm">

<div class="step">
<label>What type of work do you need?</label>
<select id="category" required>
<option value="">Select category</option>
<option>Bathroom</option>
<option>Building</option>
<option>Carpentry</option>
<option>Cleaning</option>
<option>Electrical</option>
<option>Flooring</option>
<option>Gardening</option>
<option>Heating / Gas</option>
<option>Painting & Decorating</option>
<option>Plumbing</option>
<option>Roofing</option>
<option>Other</option>
</select>
</div>

<div class="step">
<label>Job title</label>
<input type="text" id="title" required minlength="10">
</div>

<div class="step">
<label>Job description</label>
<textarea id="description" required minlength="25"></textarea>
<div class="counter"><span id="chars">0</span>/25 minimum</div>
</div>

<div class="step">
<label>Job location</label>
<input type="text" id="location" placeholder="City or postcode" required>
</div>

<div class="step">
<label>Upload photos (optional – max 5)</label>
<div class="dropzone" id="dropzone">Click or drag photos here</div>
<input type="file" id="photos" multiple accept="image/*" hidden>
<div class="preview" id="preview"></div>
</div>

<button class="btn" type="submit">Submit Job for Review</button>
<p class="error" id="error"></p>

</form>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
import { getFirestore, collection, addDoc, serverTimestamp, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
import { getStorage, ref, uploadBytes, getDownloadURL } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-storage.js";

const firebaseConfig = { /* YOUR CONFIG */ };
const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);
const storage = getStorage(app);

fetch("navbar.html").then(r=>r.text()).then(html=>{
  document.getElementById("navbar-container").innerHTML = html;
}).then(()=>import("./navbar.js"));

let user;
let files=[];

onAuthStateChanged(auth,async u=>{
  if(!u){window.location.href="signup.html";return;}
  const snap = await getDoc(doc(db,"users",u.uid));
  if(!snap.data()?.verified){
    window.location.href="verify.html";
    return;
  }
  user=u;
});

const desc=document.getElementById("description");
const chars=document.getElementById("chars");
desc.addEventListener("input",()=>chars.textContent=desc.value.length);

const dropzone=document.getElementById("dropzone");
const photos=document.getElementById("photos");
const preview=document.getElementById("preview");

dropzone.onclick=()=>photos.click();
photos.onchange=()=>{
  files=[...photos.files].slice(0,5);
  preview.innerHTML="";
  files.forEach(f=>{
    const img=document.createElement("img");
    img.src=URL.createObjectURL(f);
    preview.appendChild(img);
  });
};

document.getElementById("jobForm").onsubmit=async e=>{
  e.preventDefault();
  const error=document.getElementById("error");
  error.textContent="";

  if(desc.value.length<25){
    error.textContent="Description must be at least 25 characters.";
    return;
  }

  try{
    const urls=[];
    for(const f of files){
      const r=ref(storage,`jobs/${user.uid}/${Date.now()}_${f.name}`);
      await uploadBytes(r,f);
      urls.push(await getDownloadURL(r));
    }

    await addDoc(collection(db,"jobs"),{
      title:title.value,
      description:desc.value,
      category:category.value,
      location:location.value,
      images:urls,
      ownerId:user.uid,
      approved:false,
      creditCost:0,
      createdAt:serverTimestamp()
    });

    alert("✅ Job submitted! It will go live once approved.");
    window.location.href="index.html";

  }catch(err){
    error.textContent=err.message;
  }
};
</script>

</body>
</html>
