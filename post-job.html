<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Post a Job | LocalJobsUK</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="style.css">
<style>
form { max-width: 500px; margin: 20px auto; display:flex; flex-direction:column; gap:10px; background:#fff; padding:20px; border-radius:8px; box-shadow:0 2px 6px rgba(0,0,0,0.1); }
input, textarea, select, button { padding:8px; border-radius:5px; border:1px solid #ccc; }
button { background:#455a64; color:#fff; cursor:pointer; border:none; }
#photoPreview img { max-width:100px; margin:5px; border-radius:5px; }
.message { margin:10px 0; padding:10px; border-radius:5px; background:#e0f7fa; color:#006064; }
</style>
</head>
<body>

<div id="navbar-container"></div>

<h2 style="text-align:center;">Post a Job</h2>

<form id="jobForm">
  <input type="text" id="title" placeholder="Job title" required>
  <textarea id="description" placeholder="Job description" rows="5" required></textarea>
  <input type="text" id="location" placeholder="Location">
  <label>Add Photos (max 5):</label>
  <input type="file" id="photos" accept="image/*" multiple>
  <div id="photoPreview"></div>

  <label for="category">Category:</label>
  <select id="category" required>
    <option value="">Select category</option>
    <option value="Gardening">Gardening</option>
    <option value="Cleaning">Cleaning</option>
    <option value="Delivery">Delivery</option>
    <option value="IT">IT</option>
    <option value="Other">Other</option>
  </select>

  <button type="submit">Submit Job</button>
  <div id="jobMessage" class="message" style="display:none;"></div>
</form>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getFirestore, collection, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
import { getStorage, ref, uploadBytes, getDownloadURL } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-storage.js";

const firebaseConfig = { /* your config */ };
const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const auth = getAuth(app);
const storage = getStorage(app);

let currentUser = null;

onAuthStateChanged(auth, user => {
  if(!user) window.location.href="login.html";
  else currentUser = user;
});

// Photo preview
const photoInput = document.getElementById("photos");
const photoPreview = document.getElementById("photoPreview");
photoInput.addEventListener("change", () => {
  photoPreview.innerHTML = "";
  const files = Array.from(photoInput.files).slice(0,5);
  files.forEach(file=>{
    const reader = new FileReader();
    reader.onload = e=>{
      const img = document.createElement("img");
      img.src = e.target.result;
      photoPreview.appendChild(img);
    };
    reader.readAsDataURL(file);
  });
});

document.getElementById("jobForm").addEventListener("submit", async e=>{
  e.preventDefault();
  const messageEl = document.getElementById("jobMessage");
  messageEl.style.display="none";

  const title = document.getElementById("title").value.trim();
  const description = document.getElementById("description").value.trim();
  const location = document.getElementById("location").value.trim();
  const category = document.getElementById("category").value;

  if(!title||!description||!category){
    alert("Please fill title, description and category.");
    return;
  }

  // Upload photos
  const photosFiles = Array.from(photoInput.files).slice(0,5);
  const photoUrls = [];
  for(const file of photosFiles){
    const storageRef = ref(storage, `job-photos/${currentUser.uid}/${Date.now()}-${file.name}`);
    const snapshot = await uploadBytes(storageRef, file);
    const url = await getDownloadURL(snapshot.ref);
    photoUrls.push(url);
  }

  try {
    await addDoc(collection(db,"jobs"),{
      title,
      description,
      location,
      category,
      images: photoUrls,
      ownerId: currentUser.uid,
      createdAt: serverTimestamp(),
      approved:false,
      creditCost:0
    });

    messageEl.innerText="✅ Job submitted successfully! It will be reviewed by the admin.";
    messageEl.style.display="block";
    document.getElementById("jobForm").reset();
    photoPreview.innerHTML="";
  } catch(err){
    messageEl.innerText="❌ Error submitting job: "+err.message;
    messageEl.style.display="block";
  }
});
</script>
<script>
fetch("navbar.html").then(r=>r.text()).then(html=>{
  document.getElementById("navbar-container").innerHTML = html;
  const script = document.createElement("script");
  script.src = "navbar.js";
  document.body.appendChild(script);
});
</script>
</body>
</html>
