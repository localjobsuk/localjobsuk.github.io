<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Post a Job | LocalJobsUK</title>
<link rel="stylesheet" href="style.css">
<style>
form { max-width: 500px; margin: 20px auto; display: flex; flex-direction: column; gap: 10px; background: #fff; padding: 20px; border-radius: 8px; box-shadow: 0 2px 6px rgba(0,0,0,0.1); }
input, textarea, select { padding: 8px; border-radius: 5px; border: 1px solid #ccc; }
button { background-color: #455a64; color: #fff; border: none; padding: 10px; border-radius: 5px; cursor: pointer; }
</style>
</head>
<body>

<!-- Navbar -->
<div id="navbar-container"></div>

<h2>Post a Job</h2>
<form id="jobForm">
  <input type="text" id="title" placeholder="Job title" required>
  <textarea id="description" placeholder="Job description" rows="5" required></textarea>
  <input type="text" id="location" placeholder="Location">
  <input type="text" id="images" placeholder="Image URLs, comma separated">
  <label for="category">Category:</label>
  <select id="category" required>
    <option value="">Select category</option>
    <option value="Gardening">Gardening</option>
    <option value="Cleaning">Cleaning</option>
    <option value="Delivery">Delivery</option>
    <option value="IT">IT</option>
    <option value="Other">Other</option>
  </select>
  <button type="submit">Submit Job</button>
</form>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getFirestore, collection, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

// Firebase config
const firebaseConfig = { /* your config */ };
const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const auth = getAuth(app);

// Make logout global
window.logout = async function() {
  await signOut(auth);
  window.location.href = "index.html";
};

// Load navbar
document.addEventListener("DOMContentLoaded", async () => {
  const navbarHtml = await fetch("navbar.html").then(r=>r.text());
  document.getElementById("navbar-container").innerHTML = navbarHtml;
  const navScript = document.createElement("script");
  navScript.src = "navbar.js";
  document.body.appendChild(navScript);

  // Auth state to show login/logout links
  const navLinks = document.getElementById("navLinks");
  onAuthStateChanged(auth, user => {
    if (user) {
      navLinks.innerHTML = `
        <a href="owner-dashboard.html">My Jobs</a>
        <a href="#" onclick="logout()">Logout</a>
      `;
    } else {
      navLinks.innerHTML = `
        <a href="login.html">Login</a>
        <a href="post-job.html">Post a Job</a>
      `;
    }
  });
});

// Submit job
document.getElementById("jobForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  const user = auth.currentUser;
  if (!user) return window.location.href = "login.html";

  const title = document.getElementById("title").value.trim();
  const description = document.getElementById("description").value.trim();
  const location = document.getElementById("location").value.trim();
  const images = document.getElementById("images").value.trim().split(",").map(s=>s.trim());
  const category = document.getElementById("category").value;

  if (!title || !description || !category) return alert("Title, description, and category are required.");

  try {
    await addDoc(collection(db, "jobs"), {
      title,
      description,
      location,
      images,
      category,
      ownerId: user.uid,
      createdAt: serverTimestamp(),
      approved: false,
      creditCost: 0
    });
    alert("Job submitted! Waiting for admin approval.");
    document.getElementById("jobForm").reset();
  } catch (err) {
    alert("Error submitting job: " + err.message);
  }
});
</script>

</body>
</html>
