<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Post a Job | LocalJobsUK</title>
<link rel="stylesheet" href="style.css">

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

<style>
form { max-width: 500px; margin: 40px auto; display: flex; flex-direction: column; gap: 12px; background: #fff; padding: 20px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
input, textarea, select { padding: 8px; border-radius: 5px; border: 1px solid #ccc; width:100%; }
button { background-color: #203a43; color: #fff; border: none; padding: 10px; border-radius: 5px; cursor: pointer; font-weight:bold; }
</style>
</head>

<body>

<!-- Navbar -->
<div id="navbar-container"></div>

<h2 style="text-align:center;margin-top:30px;">Post a Job</h2>

<form id="jobForm">
  <input type="text" id="title" placeholder="Job title" required>
  <textarea id="description" placeholder="Job description" rows="5" required></textarea>
  <input type="text" id="location" placeholder="Location">
  <input type="text" id="images" placeholder="Image URLs, comma separated">
  <label for="category">Category:</label>
  <select id="category" required>
    <option value="">Select category</option>
    <option value="Gardening">Gardening</option>
    <option value="Cleaning">Cleaning</option>
    <option value="Delivery">Delivery</option>
    <option value="IT">IT</option>
    <option value="Other">Other</option>
  </select>
  <button type="submit">Submit Job</button>
</form>

<!-- Firebase Config -->
<script>
const firebaseConfig = {
  apiKey: "YOUR_API_KEY",
  authDomain: "YOUR_PROJECT.firebaseapp.com",
  projectId: "YOUR_PROJECT",
  storageBucket: "YOUR_PROJECT.appspot.com",
  messagingSenderId: "YOUR_SENDER_ID",
  appId: "YOUR_APP_ID"
};

if (!firebase.apps.length) {
  firebase.initializeApp(firebaseConfig);
}
const auth = firebase.auth();
const db = firebase.firestore();
</script>

<!-- Load Navbar -->
<script>
document.addEventListener("DOMContentLoaded", function() {
  fetch("navbar.html")
    .then(r => r.text())
    .then(html => document.getElementById("navbar-container").innerHTML = html)
    .then(() => {
      const s = document.createElement("script");
      s.src = "navbar.js";
      document.body.appendChild(s);
    })
    .catch(e => console.error("Navbar failed to load:", e));
});
</script>

<!-- Job Submission Script -->
<script>
let currentUser = null;

auth.onAuthStateChanged(user => {
  if (!user) window.location.href = "login.html";
  currentUser = user;
});

document.getElementById("jobForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  const title = document.getElementById("title").value.trim();
  const description = document.getElementById("description").value.trim();
  const location = document.getElementById("location").value.trim();
  const imagesRaw = document.getElementById("images").value.trim();
  const images = imagesRaw ? imagesRaw.split(",").map(s => s.trim()) : [];
  const category = document.getElementById("category").value;

  if (!title || !description || !category) {
    alert("Title, description, and category are required.");
    return;
  }

  try {
    await db.collection("jobs").add({
      title,
      description,
      location,
      images,
      category,
      ownerId: currentUser.uid,
      createdAt: firebase.firestore.FieldValue.serverTimestamp(),
      approved: false,
      creditCost: 0
    });
    alert("Job submitted! Waiting for admin approval.");
    document.getElementById("jobForm").reset();
  } catch(err) {
    alert("Error submitting job: " + err.message);
  }
});
</script>

</body>
</html>
