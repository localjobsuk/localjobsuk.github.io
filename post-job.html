<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Post a Job | LocalJobsUK</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="navbar-container"></div>
  <main>
    <!-- page content here -->
  </main>
</body>

<div id="navbar-container"></div>

<h2 style="text-align:center;">Post a Job</h2>

<form id="jobForm">
  <input type="text" id="title" placeholder="Job title" required>
  <textarea id="description" placeholder="Job description" rows="5" required></textarea>
  <input type="text" id="location" placeholder="Location">

  <label for="category">Category:</label>
  <select id="category" required>
    <option value="">Select category</option>
    <option value="Gardening">Gardening</option>
    <option value="Cleaning">Cleaning</option>
    <option value="Delivery">Delivery</option>
    <option value="IT">IT</option>
    <option value="Other">Other</option>
  </select>

  <div class="photos-dropzone" id="photosDropzone">
    Drag & drop photos here or click to add (max 5)
  </div>
  <input type="file" id="photoInput" accept="image/*" multiple style="display:none;">
  <div class="photos-preview" id="photosPreview"></div>

  <div class="spinner" id="spinner"></div>
  <button type="submit" id="submitBtn">Submit Job</button>
</form>

<div class="toast" id="toast"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getFirestore, collection, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
import { getStorage, ref, uploadBytes, getDownloadURL } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-storage.js";

const firebaseConfig = { /* your config */ };
const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const auth = getAuth(app);
const storage = getStorage(app);

let currentUser=null, selectedFiles=[];

// Navbar
document.addEventListener("DOMContentLoaded", async () => {
  const navbarContainer = document.getElementById("navbar-container");
  const response = await fetch("navbar.html");
  navbarContainer.innerHTML = await response.text();
  await import("./navbar.js");
});

// Auth check
onAuthStateChanged(auth,user=>{
  if(!user) window.location.href="login.html";
  currentUser=user;
});

// Toast helper
function showToast(message){
  const toast = document.getElementById("toast");
  toast.textContent = message;
  toast.style.display="block";
  setTimeout(()=>{toast.style.display="none";}, 3000);
}

// Drag & drop
const dropzone = document.getElementById("photosDropzone");
const photoInput = document.getElementById("photoInput");
const photosPreview = document.getElementById("photosPreview");

dropzone.addEventListener("click",()=>photoInput.click());
dropzone.addEventListener("dragover", e=>{e.preventDefault(); dropzone.classList.add("dragover");});
dropzone.addEventListener("dragleave", e=>dropzone.classList.remove("dragover"));
dropzone.addEventListener("drop", e=>{ e.preventDefault(); dropzone.classList.remove("dragover"); handleFiles(Array.from(e.dataTransfer.files)); });
photoInput.addEventListener("change",()=>handleFiles(Array.from(photoInput.files)));

function handleFiles(files){
  selectedFiles = selectedFiles.concat(files).slice(0,5);
  photosPreview.innerHTML="";
  selectedFiles.forEach((file,index)=>{
    const reader=new FileReader();
    reader.onload=e=>{
      const wrapper=document.createElement("div");
      wrapper.classList.add("photo-wrapper");
      const img=document.createElement("img");
      img.src=e.target.result;
      const removeBtn=document.createElement("button");
      removeBtn.textContent="×";
      removeBtn.classList.add("remove-photo");
      removeBtn.addEventListener("click",()=>{ selectedFiles.splice(index,1); wrapper.remove(); });
      wrapper.appendChild(img);
      wrapper.appendChild(removeBtn);
      photosPreview.appendChild(wrapper);
    };
    reader.readAsDataURL(file);
  });
}

// Submit
document.getElementById("jobForm").addEventListener("submit", async e=>{
  e.preventDefault();
  if(!currentUser) return showToast("Please login first.");
  const title=document.getElementById("title").value.trim();
  const description=document.getElementById("description").value.trim();
  const location=document.getElementById("location").value.trim();
  const category=document.getElementById("category").value;

  if(title.length<5 || description.length<10) return showToast("Title ≥5 & description ≥10 chars");
  if(!category) return showToast("Select a category");

  const spinner=document.getElementById("spinner");
  const submitBtn=document.getElementById("submitBtn");
  spinner.style.display="block"; submitBtn.disabled=true;

  try{
    const imageUrls=[];
    for(const file of selectedFiles){
      const storageRef=ref(storage,`jobs/${currentUser.uid}/${Date.now()}_${file.name}`);
      await uploadBytes(storageRef,file);
      const url=await getDownloadURL(storageRef);
      imageUrls.push(url);
    }
    await addDoc(collection(db,"jobs"),{
      title,description,location,category,images:imageUrls,
      ownerId:currentUser.uid,createdAt:serverTimestamp(),approved:false,creditCost:0
    });
    showToast("🎉 Job submitted successfully! Admin will review shortly.");
    document.getElementById("jobForm").reset();
    photosPreview.innerHTML="";
    selectedFiles=[];
  }catch(err){showToast("❌ Error posting job: "+err.message);}
  finally{spinner.style.display="none"; submitBtn.disabled=false;}
});

window.logout=async()=>{await signOut(auth); window.location.href="index.html";}
</script>
</body>
</html>
