<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Post a Job | LocalJobsUK</title>
<link rel="stylesheet" href="style.css">
<style>
form { max-width:500px; margin:20px auto; display:flex; flex-direction:column; gap:10px; background:#fff; padding:20px; border-radius:8px; box-shadow:0 2px 6px rgba(0,0,0,0.1); }
input, textarea, select, button { padding:8px; border-radius:5px; border:1px solid #ccc; }
button { background-color:#203a43; color:#fff; border:none; cursor:pointer; font-weight:bold; }
button:hover { background-color:#0d263f; }
#photoPreview img { max-width:100%; margin:5px 0; border-radius:5px; }
</style>
</head>
<body>

<!-- Navbar -->
<div id="navbar-container"></div>

<h2 style="text-align:center;">Post a Job</h2>

<form id="jobForm">
  <input type="text" id="title" placeholder="Job title" required>
  <textarea id="description" placeholder="Job description" rows="5" required></textarea>
  <input type="text" id="location" placeholder="Location">
  <label for="category">Category:</label>
  <select id="category" required>
    <option value="">Select category</option>
    <option value="Gardening">Gardening</option>
    <option value="Cleaning">Cleaning</option>
    <option value="Delivery">Delivery</option>
    <option value="IT">IT</option>
    <option value="Other">Other</option>
  </select>

  <!-- Add Photos -->
  <div>
    <button type="button" id="addPhotosBtn">Add Photos (max 5)</button>
    <input type="file" id="photoInput" accept="image/*" multiple style="display:none;">
    <div id="photoPreview"></div>
  </div>

  <button type="submit">Submit Job</button>
</form>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getFirestore, collection, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
import { getStorage, ref, uploadBytes, getDownloadURL } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-storage.js";

// Firebase config
const firebaseConfig = { /* your config */ };
const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const auth = getAuth(app);
const storage = getStorage(app);

let currentUser = null;

// ---- Load Navbar ----
document.addEventListener("DOMContentLoaded", async () => {
  const navbarHtml = await fetch("navbar.html").then(r => r.text());
  document.getElementById("navbar-container").innerHTML = navbarHtml;

  const navScript = document.createElement("script");
  navScript.src = "navbar.js";
  document.body.appendChild(navScript);

  const navLinks = document.getElementById("navLinks");
  onAuthStateChanged(auth, user => {
    if(!user) window.location.href = "login.html";
    if(user){
      currentUser = user;
      navLinks.innerHTML = `
        <a href="owner-dashboard.html">My Jobs</a>
        <a href="worker.html">Available Jobs</a>
        <a href="#" onclick="logout()">Logout</a>
      `;
    }
  });
});

window.logout = async function() {
  await auth.signOut();
  window.location.href = "index.html";
}

// ---- Photo Upload ----
const addPhotosBtn = document.getElementById("addPhotosBtn");
const photoInput = document.getElementById("photoInput");
const photoPreview = document.getElementById("photoPreview");
let selectedPhotos = [];

addPhotosBtn.addEventListener("click", () => photoInput.click());

photoInput.addEventListener("change", () => {
  const files = Array.from(photoInput.files).slice(0,5);
  selectedPhotos = files;
  photoPreview.innerHTML = "";
  files.forEach(f => {
    const img = document.createElement("img");
    img.src = URL.createObjectURL(f);
    photoPreview.appendChild(img);
  });
});

// ---- Submit Job ----
document.getElementById("jobForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  if(!currentUser) return alert("Not logged in");

  const title = document.getElementById("title").value.trim();
  const description = document.getElementById("description").value.trim();
  const location = document.getElementById("location").value.trim();
  const category = document.getElementById("category").value;

  if(!title || !description || !category) return alert("Please fill required fields");

  // Upload photos to Firebase Storage
  const photoUrls = [];
  for(let i=0;i<selectedPhotos.length;i++){
    const file = selectedPhotos[i];
    const storageRef = ref(storage, `job-photos/${currentUser.uid}_${Date.now()}_${i}`);
    await uploadBytes(storageRef, file);
    const url = await getDownloadURL(storageRef);
    photoUrls.push(url);
  }

  // Add job to Firestore
  await addDoc(collection(db, "jobs"), {
    title,
    description,
    location,
    category,
    images: photoUrls,
    ownerId: currentUser.uid,
    createdAt: serverTimestamp(),
    approved: false,
    creditCost: 0
  });

  alert("Job submitted! Waiting for admin approval.");
  document.getElementById("jobForm").reset();
  photoPreview.innerHTML = "";
  selectedPhotos = [];
});
</script>
</body>
</html>
