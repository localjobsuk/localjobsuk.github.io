<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Post a Job | LocalJobsUK</title>
<link rel="stylesheet" href="styles.css">
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getFirestore, collection, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

// 🔹 Firebase config
const firebaseConfig = { /* your config */ };
const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const auth = getAuth(app);

let currentUser = null;

// Auth check
onAuthStateChanged(auth, user => {
  if (!user) window.location.href = "login.html";
  else currentUser = user;
});

// Submit job
async function submitJob(event) {
  event.preventDefault();

  const title = document.getElementById("title").value.trim();
  const description = document.getElementById("description").value.trim();
  const location = document.getElementById("location").value.trim();
  const imagesRaw = document.getElementById("images").value.trim();
  const images = imagesRaw ? imagesRaw.split(",").map(s => s.trim()) : [];
  const category = document.getElementById("category").value;

  if (!title || !description || !category) {
    alert("Title, description, and category are required.");
    return;
  }

  try {
    await addDoc(collection(db, "jobs"), {
      title,
      description,
      location,
      images,
      category,      // ✅ New category field
      ownerId: currentUser.uid,
      createdAt: serverTimestamp(),
      approved: false,
      creditCost: 0
    });

    alert("Job submitted! Waiting for admin approval.");
    document.getElementById("jobForm").reset();
  } catch (err) {
    alert("Error submitting job: " + err.message);
  }
}
</script>
<style>
form { max-width: 500px; margin: 20px auto; display: flex; flex-direction: column; gap: 10px; background: #fff; padding: 20px; border-radius: 8px; box-shadow: 0 2px 6px rgba(0,0,0,0.1); }
input, textarea, select { padding: 8px; border-radius: 5px; border: 1px solid #ccc; }
button { background-color: #455a64; color: #fff; border: none; padding: 10px; border-radius: 5px; cursor: pointer; }
</style>
</head>
<body>
<h2>Post a Job</h2>
<form id="jobForm" onsubmit="submitJob(event)">
  <input type="text" id="title" placeholder="Job title" required>
  <textarea id="description" placeholder="Job description" rows="5" required></textarea>
  <input type="text" id="location" placeholder="Location">
  <input type="text" id="images" placeholder="Image URLs, comma separated">
  <label for="category">Category:</label>
  <select id="category" required>
    <option value="">Select category</option>
    <option value="Gardening">Gardening</option>
    <option value="Cleaning">Cleaning</option>
    <option value="Delivery">Delivery</option>
    <option value="IT">IT</option>
    <option value="Other">Other</option>
  </select>
  <button type="submit">Submit Job</button>
</form>
</body>
</html>
