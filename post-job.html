<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Post a Job - LocalJobsUK</title>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="navbar-container"></div>

<h2>Post a Job</h2>

<div class="info-box">
  Fill in the job details below.
</div>

<div class="form-box">
  <input type="text" id="title" placeholder="Job Title">
  <textarea id="description" placeholder="Job Description"></textarea>
  <input type="text" id="location" placeholder="Location (e.g. London)">
  <input type="number" id="creditCost" placeholder="Credit Cost (e.g. 10)">
  <button onclick="postJob()">Post Job</button>
</div>

<script>
fetch("navbar.html")
  .then(res => res.text())
  .then(data => document.getElementById("navbar-container").innerHTML = data)
  .then(() => { 
      const script = document.createElement("script");
      script.src = "navbar.js";
      document.body.appendChild(script);
  });

const db = firebase.firestore();

firebase.auth().onAuthStateChanged(user => {
  if (!user) window.location.href = "login.html";
});

async function postJob() {
  const user = firebase.auth().currentUser;

  const title = document.getElementById("title").value;
  const description = document.getElementById("description").value;
  const location = document.getElementById("location").value;
  const creditCost = parseInt(document.getElementById("creditCost").value) || 1;

  if (!title || !description || !location) {
    alert("Please fill all fields.");
    return;
  }

  await db.collection("jobs").add({
    title,
    description,
    location,
    creditCost,
    posterId: user.uid,
    createdAt: firebase.firestore.FieldValue.serverTimestamp(),
    status: "active"
  });

  alert("Job posted successfully!");
  window.location.href = "owner-dashboard.html";
}
</script>

</body>
</html>
