<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Post a Job | LocalJobsUK</title>
<link rel="stylesheet" href="style.css">

<style>
.container {
  max-width: 700px;
  margin: 60px auto;
  background: #fff;
  padding: 40px;
  border-radius: 12px;
  box-shadow: 0 10px 25px rgba(0,0,0,0.08);
}

.container h1 {
  text-align: center;
  margin-bottom: 30px;
}

.form-group {
  margin-bottom: 20px;
}

.form-group label {
  font-weight: 600;
  display: block;
  margin-bottom: 8px;
}

.form-group input,
.form-group textarea,
.form-group select {
  width: 100%;
  padding: 12px;
  border-radius: 8px;
  border: 1px solid #ddd;
  font-size: 1rem;
}

textarea {
  min-height: 120px;
  resize: vertical;
}

button {
  width: 100%;
  padding: 15px;
  border-radius: 8px;
  border: none;
  background: #203a43;
  color: #fff;
  font-weight: bold;
  font-size: 1rem;
  cursor: pointer;
  transition: 0.3s;
}

button:hover {
  background: #3498db;
}

.message {
  margin-top: 15px;
  text-align: center;
  font-weight: 600;
}

.success { color: green; }
.error { color: red; }

@media(max-width:768px){
  .container { margin: 20px; padding: 25px; }
}
</style>
</head>
<body>

<div id="navbar-container"></div>

<div class="container">
  <h1>Post a Job</h1>

  <form id="jobForm">
    <div class="form-group">
      <label>Job Title</label>
      <input type="text" id="title" required>
    </div>

    <div class="form-group">
      <label>Category</label>
      <select id="category" required>
        <option value="">Select category</option>
        <option>Bathroom Fitting</option>
        <option>Building</option>
        <option>Carpentry</option>
        <option>Cleaning</option>
        <option>Decorating</option>
        <option>Electrical</option>
        <option>Gardening</option>
        <option>Plumbing</option>
        <option>Roofing</option>
        <option>Tiling</option>
        <option>Other</option>
      </select>
    </div>

    <div class="form-group">
      <label>Description</label>
      <textarea id="description" required></textarea>
    </div>

    <div class="form-group">
      <label>Location</label>
      <input type="text" id="location" placeholder="City or postcode" required>
    </div>

    <div class="form-group">
      <label>Upload Images (optional)</label>
      <input type="file" id="images" multiple accept="image/*">
    </div>

    <button type="submit">Submit Job</button>
    <div id="formMessage" class="message"></div>
  </form>
</div>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-storage-compat.js"></script>

<script>
const firebaseConfig = { /* your config */ };
firebase.initializeApp(firebaseConfig);

const auth = firebase.auth();
const db = firebase.firestore();
const storage = firebase.storage();

// Load navbar
document.addEventListener("DOMContentLoaded",()=>{
  fetch("navbar.html")
    .then(r=>r.text())
    .then(html=>document.getElementById("navbar-container").innerHTML=html)
    .then(()=>import("./navbar.js"));
});

// Redirect if not logged in
auth.onAuthStateChanged(user=>{
  if(!user){
    window.location.href="signup.html";
  }
});

// Submit form
document.getElementById("jobForm").addEventListener("submit", async (e)=>{
  e.preventDefault();
  const message = document.getElementById("formMessage");
  message.textContent = "Submitting...";
  message.className="message";

  try {
    const user = auth.currentUser;
    const files = document.getElementById("images").files;
    let imageUrls = [];

    // Upload images
    for (let file of files) {
      const ref = storage.ref().child("job-images/" + Date.now() + "-" + file.name);
      await ref.put(file);
      const url = await ref.getDownloadURL();
      imageUrls.push(url);
    }

    // Save job
    await db.collection("jobs").add({
      title: document.getElementById("title").value,
      category: document.getElementById("category").value,
      description: document.getElementById("description").value,
      location: document.getElementById("location").value,
      images: imageUrls,
      userId: user.uid,
      userEmail: user.email,
      approved: false,
      createdAt: firebase.firestore.FieldValue.serverTimestamp()
    });

    message.textContent = "Job submitted successfully! Awaiting approval.";
    message.className="message success";
    document.getElementById("jobForm").reset();

  } catch (err) {
    message.textContent = "Error: " + err.message;
    message.className="message error";
  }
});
</script>

</body>
</html>
