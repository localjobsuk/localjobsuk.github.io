<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
import { getFirestore, doc, getDoc, collection, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
import { getStorage, ref, uploadBytes, getDownloadURL } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-storage.js";

const firebaseConfig = { /* your config */ };
const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);
const storage = getStorage(app);

let currentUser=null;
let userData=null;
let selectedFiles=[];

// Navbar load
fetch("navbar.html").then(r=>r.text()).then(html=>document.getElementById("navbar-container").innerHTML=html).then(()=>import("./navbar.js"));

// Check auth & verification
onAuthStateChanged(auth, async (user)=>{
  if(!user){
    // Not signed in → redirect to signup
    window.location.href="signup.html";
    return;
  }
  currentUser=user;

  // Get user data
  const docSnap = await getDoc(doc(db, "users", user.uid));
  if(docSnap.exists()){
    userData = docSnap.data();
    if(!userData.verified){
      // Signed in but not verified → redirect to verify page
      alert("You must verify your account before posting a job.");
      window.location.href="verify.html";
      return;
    }
  } else {
    // User record not found → redirect to signup
    window.location.href="signup.html";
    return;
  }
});

// --- PHOTO UPLOAD HANDLER ---
const addPhotosBtn=document.querySelector(".add-photos-btn");
const photoInput=document.getElementById("photoInput");
const photosPreview=document.getElementById("photosPreview");

addPhotosBtn.addEventListener("click",()=>photoInput.click());
photoInput.addEventListener("change",()=>{
  selectedFiles=Array.from(photoInput.files).slice(0,5);
  photosPreview.innerHTML="";
  selectedFiles.forEach(file=>{
    const reader=new FileReader();
    reader.onload=e=>{
      const img=document.createElement("img");
      img.src=e.target.result;
      photosPreview.appendChild(img);
    };
    reader.readAsDataURL(file);
  });
});

// --- SUBMIT JOB ---
document.getElementById("jobForm").addEventListener("submit",async e=>{
  e.preventDefault();
  if(!currentUser || !userData || !userData.verified) return;

  const title=document.getElementById("title").value.trim();
  const description=document.getElementById("description").value.trim();
  const location=document.getElementById("location").value.trim();
  const category=document.getElementById("category").value;
  if(!title||!description||!category) return alert("Title, description, and category are required.");

  try{
    const imageUrls=[];
    for(const file of selectedFiles){
      const storageRef=ref(storage,`jobs/${currentUser.uid}/${Date.now()}_${file.name}`);
      await uploadBytes(storageRef,file);
      const url=await getDownloadURL(storageRef);
      imageUrls.push(url);
    }

    await addDoc(collection(db,"jobs"),{
      title, description, location, category, images:imageUrls,
      ownerId: currentUser.uid,
      createdAt: serverTimestamp(),
      approved:false, // admin sets
      creditCost:0
    });

    alert("🎉 Job submitted successfully! Waiting for admin approval.");
    document.getElementById("jobForm").reset();
    photosPreview.innerHTML="";
    selectedFiles=[];
  }catch(err){ alert("❌ Error posting job: "+err.message); }
});
</script>
