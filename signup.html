<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign Up | LocalJobsUK</title>
<link rel="stylesheet" href="style.css">
<style>
body { font-family: 'Inter', sans-serif; background:#f7f7f7; margin:0; padding:0; }
.container { max-width:500px; margin:50px auto; background:#fff; padding:20px; border-radius:10px; box-shadow:0 2px 8px rgba(0,0,0,0.1); }
h2 { text-align:center; color:#203a43; }
form { display:flex; flex-direction:column; gap:12px; }
input { padding:10px; border-radius:6px; border:1px solid #ccc; font-size:1em; }
button { padding:12px; border:none; border-radius:8px; background:#203a43; color:#fff; font-weight:bold; cursor:pointer; transition:0.2s; }
button:hover { background:#3498db; }
.toast { position:fixed; bottom:20px; left:50%; transform:translateX(-50%); background:#203a43; color:#fff; padding:12px 20px; border-radius:10px; display:none; z-index:1000; }
</style>
</head>
<body>

<div class="container">
  <h2>Create an Account</h2>
  <form id="signupForm">
    <input type="text" id="firstName" placeholder="First Name" required>
    <input type="text" id="lastName" placeholder="Last Name" required>
    <input type="text" id="address" placeholder="Full Address" required>
    <input type="text" id="contactNumber" placeholder="Contact Number" required>
    <input type="email" id="email" placeholder="Email" required>
    <input type="password" id="password" placeholder="Password" required>
    <button type="submit">Sign Up</button>
  </form>
</div>

<div class="toast" id="toast"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getAuth, createUserWithEmailAndPassword, updateProfile } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
import { getFirestore, doc, setDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

const firebaseConfig = { /* your config */ };
const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

const form = document.getElementById("signupForm");
const toast = document.getElementById("toast");
function showToast(msg){ toast.textContent = msg; toast.style.display="block"; setTimeout(()=>{toast.style.display="none";},3000); }

form.addEventListener("submit", async e=>{
  e.preventDefault();
  const firstName = document.getElementById("firstName").value.trim();
  const lastName = document.getElementById("lastName").value.trim();
  const address = document.getElementById("address").value.trim();
  const contactNumber = document.getElementById("contactNumber").value.trim();
  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value;

  if(!firstName||!lastName||!address||!contactNumber||!email||!password) return showToast("Please fill all fields");

  try{
    const userCredential = await createUserWithEmailAndPassword(auth,email,password);
    const user = userCredential.user;

    await setDoc(doc(db,"users",user.uid),{
      firstName, lastName, address, contactNumber,
      verified:false, role:"user", idUrl:""
    });

    await updateProfile(user,{displayName:firstName+" "+lastName});
    showToast("Account created! Redirecting to verification...");
    setTimeout(()=>window.location.href="verify.html",1500);
  }catch(err){ showToast(err.message); }
});
</script>
</body>
</html>
